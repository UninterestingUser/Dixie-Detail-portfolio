meta:
  title: Text consent wording
  summary: The exact wording of the two text consent checkboxes, by version; the public API serves the current version and records the words shown with each answer.
  updated: 2026-11-08
  status: current
  explained_in: docs/reference/text-messages.md
  note: >-
    The website shows the current version's words next to the two unchecked checkboxes, and sends
    back the version with each answer. The server records the answer with the words of that version
    from this file, never words sent by the browser. A change of wording is a new version added
    below and made current; old versions stay, because recorded answers refer to them.

current: "2026-10-13"

versions:
  "2026-10-13":
    appointment: >-
      I agree to receive text messages from Dixie Detail about my appointment at the number I
      provided, including confirmations, reminders, arrival updates, payment links and receipts.
      Message frequency varies. Message and data rates may apply. Reply STOP to opt out or HELP for
      help. Consent is not a condition of purchase. See our Privacy Policy and Text Message Terms.
    follow_up: >-
      I also agree to receive occasional follow-up text messages from Dixie Detail, such as review
      requests, service reminders and offers. Message frequency varies. Message and data rates may
      apply. Reply STOP to opt out or HELP for help. Consent is not a condition of purchase.

links:
  privacy_policy: https://dixiedetail.com/privacy-policy/
  text_message_terms: https://dixiedetail.com/sms-terms/
