meta:
  title: Booking and scheduling rules
  summary: Working days, notice, arrival times, daily capacity, second-job timing and alert timing, used to seed the scheduling settings.
  updated: 2026-10-13
  status: current
  explained_in: docs/reference/scheduling-and-calendars.md
  note: Launch defaults. Once the control app exists, the live values are in the database.

closed_weekdays: [Sunday]
days_off_sources: [control app, "all-day events on the Dixie Detail Time Off calendar"]
minimum_notice_days: 2          # no same-day or next-day booking
arrival_times: ["08:00", "08:30", "09:00"]
time_zone: America/New_York

capacity:
  jobs_per_day: 1
  exception: Two Monthly Maintenance jobs can share a day
  owner_only_services: [Monthly Maintenance, Quarterly Maintenance]
  repeating_series: owner can book a single visit or a repeating series

second_monthly_job:
  start: first job's scheduled end + buffer
  buffer: drive time between the two addresses
  minimum_buffer_minutes: 30
  round_start_up_to_minutes: 15
  rounding_status: proposed during planning, not yet confirmed by the owner
  example: "08:00 job of 3 hours + 42-minute drive = 11:45 start"

second_vehicle_same_day: accepted as a request the owner approves

time_to_leave_alert:
  lead: drive time + buffer
  buffer_minutes: 10
  drive_time_from: home base, or the first job's address for a second job that day
  traffic: predicted for that time of day
  computed: at booking and again on the morning of the job
  delivery: push notification from the control app to every assigned staff member
  backup: '"Drive to job" block on the Jobs calendar'

calendars:
  jobs:
    name: Dixie Detail Jobs
    written_by: the system only
    service_account_access: edit
  time_off:
    name: Dixie Detail Time Off
    written_by: the owner
    service_account_access: read
  customers_as_guests: false
