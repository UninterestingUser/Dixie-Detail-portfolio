# The homepage's questions (owner, 2026-11-19): these six, in this order,
# each the question of an entry in faq below.
home_faq:
  - Is there a Dixie Detail shop where I can drop off my car?
  - What do you need from me on the day of the appointment?
  - I have stuff in my car. Does it need to be empty before you arrive?
  - Do the glove box and center console need to be empty?
  - I have a situation that goes beyond a normal detail. How do I book that?
  - How much are your services?

# Every question on /faq/, in order. Prices are {from:Service} and
# {price:Service} tokens, filled from the pricebook at build time.
faq:
  - question: Do you come to Cleveland, Athens, and Chattanooga?
    answer: >-
      Yes. Dixie Detail is mobile. We regularly book driveways across
      Bradley, McMinn, Hamilton, Polk, and Meigs Counties.
  # owner, 2026-11-19.
  - question: Is there a Dixie Detail shop where I can drop off my car?
    answer: >-
      We are strictly mobile at this time and do not have a retail shop
      location. This keeps overhead low and allows more flexibility for how
      we serve our customers. If there is enough demand in the future, we may
      look at adding a fixed location, but for now we're happy to come to
      your driveway.
  # owner, 2026-11-19: replaces "How much is a mobile car detail?", with
  # the same answer. Prices from the pricebook.
  - question: How much are your services?
    answer: >-
      A Full Detail starts at {from:Full Detail}, depending on the vehicle's
      size. Paint correction starts at {from:1-Step Paint Correction}.
      Headlight restoration is {price:Headlight Restoration} for both lights.
      Carpet and seat extraction are add-ons from {from:Carpet Extraction}.
      Pick your vehicle on the booking page and the exact price shows before
      you book.
  # owner, 2026-11-19: replaces "What do I need to provide on the day of the
  # appointment?".
  - question: What do you need from me on the day of the appointment?
    answer: >-
      We bring all of the cleaning equipment and expertise. The only things
      we need from you are a suitable space to perform the work, a water
      connection, and a power connection. We supply cords, hoses, and a tent
      to shield from sun and rain during the process.
  # owner, 2026-11-19.
  - question: I have stuff in my car. Does it need to be empty before you arrive?
    answer: >-
      A few items in the car is normal. We'll carefully move or clean around
      them. If parts of the vehicle are buried in items or trash, it will need
      to be removed prior to service. The car doesn't need to be perfect. We
      expect to remove some trash along the way since we get into the areas
      where nobody looks, but if there are too many loose items in the
      vehicle, it becomes difficult to tell what should be kept or thrown
      away. It also cuts into the service time and we can't get your car as
      clean as we otherwise would due to time constraints. Just give the car a
      good pickup before we arrive and we'll take it to the finish line.
  # owner, 2026-11-19.
  - question: Do the glove box and center console need to be empty?
    answer: >-
      The glove box and center console are included in an interior detail,
      but it's your choice. If they're full and you'd rather we just leave
      them alone, we can do that. If they're empty or just have a few items,
      we're happy to get them clean.
  - question: How long does the service take?
    answer: >-
      Plan on most of a day for a full detail. Larger trucks and SUVs, heavy
      interiors, and paint correction run longer. We typically handle one
      vehicle per day. It's a lengthy service, but the results speak for
      themselves.
  - question: Do you detail trucks, SUVs, and vans?
    # updated: full-size vans are quoted by hand (decision 0099).
    answer: >-
      Yes. Coupes, sedans, crossovers, light pickups, midsize and full-size
      SUVs, minivans, full-size trucks, and motorcycles. Pricing is by
      vehicle class when you book. Full-size vans are quoted by hand: send a
      quote request from the booking page and we'll reply with a price.
  # owner, 2026-11-19.
  - question: I have a situation that goes beyond a normal detail. How do I book that?
    answer: >-
      You can give us a call at (423) 380-9120 and we'll be happy to discuss
      it. Also, you can visit the booking page to enter your vehicle and
      select your service. For all full details or interior details, there is
      an additional question about the condition of the vehicle. Select
      "Let's talk" and it will take you to a form to provide a description and
      submit photos. Either way, if it's something we can help with, we'll
      get you a quote.
  - question: What's the difference between a detail and paint correction?
    answer: >-
      A detail addresses dirt and contamination inside and outside the
      vehicle. A paint correction is a specialty service to restore the gloss
      of the paint after it's been cleaned. All paint correction appointments
      include an exterior decontamination wash, so there's no need to book
      that separately. If you want a full detail plus paint correction, then
      book the paint correction plus an interior detail and that will cover
      everything.
  - question: Can you do more than one car per day?
    answer: >-
      Due to the attention we give every job, we typically only book one
      vehicle per day. That said, we sometimes accommodate two vehicles per
      day by adjusting the timeframe and bringing an extra set of hands to the
      appointment. We never sacrifice the quality of the service, so
      multiple-vehicle requests are handled on a case-by-case basis. Feel free
      to call if you have any questions. (423) 380-9120

about:
  heading: About Dixie Detail
  subheading: An eye for perfection and a passion for quality
  photo_alt: Kris Grassman - Professional Car Detailer - Cleveland TN
  paragraphs:
    - >-
      My name is Kris and I'm the owner-operator of Dixie Detail. We're based
      in Calhoun TN between Cleveland and Athens, and serve the southeast
      Tennessee region. Although I've been detailing cars unofficially since
      2020, it wasn't until May of 2025 that I decided to make it official
      and offer my experience and skill to the public.
    - >-
      It seems odd to have an enthusiasm for cleaning cars. But after years
      of doing it for friends and family in my spare time, I came to realize
      that I enjoy the process of restoring the showroom shine to a
      well-loved family vehicle. I revel in the technique and skill involved
      and love seeing the finished product and the end of every day.
    - >-
      When you trust Dixie Detail with your car, you're getting a
      first-class total clean with impeccable attention to every detail. This
      isn't just a quick wash and wipe down. The whole process takes the
      better part of a day as I go over the entire car with
      purpose-formulated cleaners and tools to effectively, but safely, renew
      each surface to make sure your car feels new again.
    - Give Dixie Detail a shot and fall in love with your car again.

contact:
  heading: Contact Us
  text: Have a question or comment? Call or text us and we'll get back to you right away.

reviews:
  heading: Client Reviews
  text: See real feedback from customers who trusted Dixie Detail with their vehicle.

