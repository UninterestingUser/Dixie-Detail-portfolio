hero:
  heading: Mobile Car Detailing in Cleveland Tennessee
  lead: Polishing Cleveland, Athens, and Chattanooga Tennessee. We come to you.

shine:
  eyebrow: How it works
  heading: Make your vehicle shine like new again
  text: >-
    You don't need a new car payment to glide down the road with that
    new-car feeling. Dixie Detail brings professional mobile car detailing to
    your driveway in Cleveland, Athens and Chattanooga.
  process: >-
    Our process includes a multi-step paint wash, wheels, wheel wells,
    undercarriage, engine bay, trunk, door jambs, and every crevice of the
    interior. This isn't a quick vacuum and wipe down - it's an hours-long
    meticulous process that delivers professional results.

how_it_works:
  - heading: Book the vehicle
    text: >-
      Select your vehicle type and service through our website or call
      (423) 380-9120. You'll get a time at your home, work, or wherever is
      convenient for you.
  - heading: We come to you
    text: >-
      Dixie Detail arrives with all of the necessary equipment and a tent to
      protect your vehicle during the service. You only supply a water and
      power connection and we handle the rest.
  - heading: Premium Detail
    text: >-
      A real detail takes the better part of a day. This is more than a
      quick wash and wipe down. We meticulously go over every surface of the
      vehicle to deliver a showroom finish.

service_area:
  heading: Serving Cleveland, Athens, Chattanooga, and nearby counties
  text: >-
    Dixie Detail is based in Calhoun, between Cleveland and Athens, and we
    come to you across Southeast Tennessee. If you can park it, and you're in
    the counties below, you're in range.
  counties:
    - name: Bradley County
      text: >-
        Cleveland, Charleston, Georgetown, McDonald, and the rest of Bradley
        County. This is home turf - I-75 commuters, Lee University area, and
        neighborhood driveways.
    - name: McMinn County
      text: >-
        Athens, Calhoun, Etowah, Englewood, Niota, and Riceville. If you're in
        Athens proper or the smaller towns in between, we already run that
        route.
    - name: Hamilton County
      text: >-
        Chattanooga, Hixson, Soddy-Daisy, Ooltewah, Collegedale, and Red Bank.
        Mobile detailing at the house or the office, without a trip to a
        shop.
    - name: Polk County
      text: >-
        Benton, Ocoee, Copperhill, and Ducktown. Good fit for trucks and daily
        drivers that see gravel, pollen, and lake-road dust.
    - name: Meigs County
      text: Decatur, Ten Mile, and surrounding Meigs County. Same full detail, same driveway service.

faq:
  - question: Do you come to Cleveland, Athens, and Chattanooga?
    answer: >-
      Yes. Dixie Detail is mobile. We regularly book driveways across
      Bradley, McMinn, Hamilton, Polk, and Meigs Counties.
  - question: How much is a mobile car detail?
    # updated: the old answer's price ranges were out of date.
    answer: >-
      A Full Detail starts at {from:Full Detail}, depending on the vehicle's
      size. Paint correction starts at {from:1-Step Paint Correction}.
      Headlight restoration is {price:Headlight Restoration} for both lights.
      Carpet and seat extraction are add-ons from {from:Carpet Extraction}.
      Pick your vehicle on the booking page and the exact price shows before
      you book.
  - question: What do I need to provide on the day of the appointment?
    answer: >-
      All we need is a space to perform the service and water and power
      connections nearby. We bring all of the necessary equipment including
      cords, hoses, and a tent to cover the vehicle.
  - question: How long does the service take?
    answer: >-
      Plan on most of a day for a full detail. Larger trucks and SUVs, heavy
      interiors, and paint correction run longer. We typically handle one
      vehicle per day. It's a lengthy service, but the results speak for
      themselves.
  - question: Do you detail trucks, SUVs, and vans?
    # updated: full-size vans are quoted by hand (decision 0099).
    answer: >-
      Yes. Coupes, sedans, crossovers, light pickups, midsize and full-size
      SUVs, minivans, full-size trucks, and motorcycles. Pricing is by
      vehicle class when you book. Full-size vans are quoted by hand: send a
      quote request from the booking page and we'll reply with a price.
  - question: What's the difference between a detail and paint correction?
    answer: >-
      A detail addresses dirt and contamination inside and outside the
      vehicle. A paint correction is a specialty service to restore the gloss
      of the paint after it's been cleaned. All paint correction appointments
      include an exterior decontamination wash, so there's no need to book
      that separately. If you want a full detail plus paint correction, then
      book the paint correction plus an interior detail and that will cover
      everything.
  - question: Can you do more than one car per day?
    answer: >-
      Due to the attention we give every job, we typically only book one
      vehicle per day. That said, we sometimes accommodate two vehicles per
      day by adjusting the timeframe and bringing an extra set of hands to the
      appointment. We never sacrifice the quality of the service, so
      multiple-vehicle requests are handled on a case-by-case basis. Feel free
      to call if you have any questions. (423) 380-9120

about:
  heading: About Dixie Detail
  subheading: An eye for perfection and a passion for quality
  photo_alt: Kris Grassman - Professional Car Detailer - Cleveland TN
  paragraphs:
    - >-
      My name is Kris and I'm the owner-operator of Dixie Detail. We're based
      in Calhoun TN between Cleveland and Athens, and serve the southeast
      Tennessee region. Although I've been detailing cars unofficially since
      2020, it wasn't until May of 2025 that I decided to make it official
      and offer my experience and skill to the public.
    - >-
      It seems odd to have an enthusiasm for cleaning cars. But after years
      of doing it for friends and family in my spare time, I came to realize
      that I enjoy the process of restoring the showroom shine to a
      well-loved family vehicle. I revel in the technique and skill involved
      and love seeing the finished product and the end of every day.
    - >-
      When you trust Dixie Detail with your car, you're getting a
      first-class total clean with impeccable attention to every detail. This
      isn't just a quick wash and wipe down. The whole process takes the
      better part of a day as I go over the entire car with
      purpose-formulated cleaners and tools to effectively, but safely, renew
      each surface to make sure your car feels new again.
    - Give Dixie Detail a shot and fall in love with your car again.

contact:
  heading: Contact Us
  text: Have a question or comment? Call or text us, or book online and see your price right away.

reviews:
  heading: Client Reviews
  text: See real feedback from customers who trusted Dixie Detail with their vehicle.

cities:
  - slug: cleveland-tn-mobile-detailing
    city: Cleveland
    county: Bradley County
    photo: cleveland
    photo_alt: Mobile car detailing in Cleveland, Tennessee.
    title: Mobile Detailing in Cleveland TN - Dixie Detail
    description: Mobile car detailing at your Cleveland, TN driveway. Dixie Detail serves Bradley County - Lee University, Paul Huff, Charleston, Georgetown.
    heading: Mobile Detailing in Cleveland & Bradley County
    intro: >-
      Dixie Detail comes to your driveway in Cleveland, Tennessee. No
      drop-off, no shop wait. We bring the tent, cords, and equipment; you
      just provide a suitable space (usually a driveway) with water and power
      connections nearby. We handle the rest.
    where_heading: Where we work in Bradley County
    where: >-
      Downtown Cleveland, north Cleveland and the Paul Huff / Bradley Square
      area, the Lee University and Ocoee Street neighborhoods, south
      Cleveland, Charleston, Georgetown, McDonald, Waterlevel, and the rest of
      Bradley County. If your driveway has a Bradley County address, Dixie
      Detail has you covered.
    services:
      detail: Full interior and exterior in the driveway. Daily drivers, campus cars, and work trucks.
      correction: Swirls and light scratches from automatic washes and I-75 miles. Ceramic wax when we finish.
      headlight: Both headlights. UV-damaged lenses on older Cleveland daily drivers.
      extraction: For carpets and cloth seats that a regular detail won't pull out of. Added on top of the full detail when the interior needs a deeper reset.
    faq:
      - question: Do I need to drive to a shop?
        answer: >-
          No, Dixie Detail is entirely mobile. There is no Cleveland
          storefront. We're based just north of town and come to your
          driveway to perform our premium service.
      - question: What area do you serve in Cleveland?
        answer: >-
          We'll come anywhere in Cleveland that has the room (and permission)
          for us to set up. Lee campus-area houses, Paul Huff, Keith Street,
          Stuart Road, Waterlevel Hwy neighborhoods, and the houses in the
          Mouse Creek area are regular Cleveland stops.
      - question: What do you need on site?
        answer: >-
          A legal place to park for the day, plus water and power nearby. We
          bring cords, hoses, equipment, and a tent to protect your vehicle
          from the sun or rain while we work.
      - question: Do you provide detailing in Bradley County?
        answer: >-
          Yes, we serve the entire Bradley County area. We have a van with all
          of the necessary equipment to show up to your driveway and leave you
          with a car or truck that's showroom ready.
