meta:
  title: Website content
  summary: The website's text in the owner's words - the four service cards and services page sections, each service's text, the condition level cards and the quote notes - and which picture goes with each vehicle class and section. Prices and times come from the price book.
  updated: 2026-11-19
  status: current
  explained_in: docs/reference/website-and-seo.md
  read_by: the Astro site in site/, at build time

# Website text for Phase 3, Step 6, in the owner's words (sent 2026-11-14).
# Service names match the price book exactly. Prices and times never appear
# here: the site reads them from the price book.
# card: the short text on the booking flow's service, add-on and condition cards.
# section: the services page section that carries the full text.
# only_for: the vehicle classes a service is for, when it isn't for cars,
# trucks and vans. A class named here is offered only the services naming
# it, in the quote request card's service list (owner, 2026-11-18).
# The booking flow lists the services in this order, and the add-ons
# Carpet Extraction, Seat Extraction, Headlight Restoration (owner, 2026-11-18).

# The four service sections (owner, 2026-11-18): the homepage cards, and
# the anchored sections of the one services page, /services/#<anchor>.
# title is the owner's words from the current dixiedetail.com; card is the
# owner's card text (2026-11-19), the same on the homepage and city pages.
# The card's "from" price is the lowest of the price_from services' prices,
# cars and trucks only (no motorcycle is priced for these). button is the
# card's and section's first button: "See my price" or "Add to detail".
# cta_heading is the heading of the section's red box (owner, 2026-11-18).
# old_pages are the category pages these sections replace; each redirects
# permanently to its section (site/public/_redirects).
sections:
  - anchor: detail
    title: Premium Detailing
    card: >-
      A full-service cleaning that meticulously reaches every corner of your
      car, inside and out. This isn't just a quick vacuum and wipe down. It's
      a complete restoration and you get a new car again.
    price_from: [Full Detail, Interior Only, Exterior Only]
    button: See my price
    services: [Full Detail, Interior Only, Exterior Only, Motorcycle Detail]
    cta_heading: Book your detail today
    old_pages: [detailing, motorcycle-detail]
  - anchor: correction
    title: Paint Correction
    card: >-
      Decontamination plus a machine polish to remove imperfections, finished
      with ceramic wax that protects for up to a year. This goes beyond the
      detailed cleaning to restore the glossy finish.
    price_from: [1-Step Paint Correction, 2-Step Paint Correction]
    button: See my price
    services: [1-Step Paint Correction, 2-Step Paint Correction]
    cta_heading: Book a paint correction
    old_pages: [paint-correction]
  - anchor: headlight
    title: Headlight Restoration
    card: >-
      Multi-stage removal of the UV-damaged outer layer followed by a polish
      and buff to restore clarity. We finish by adding UV protection to ensure
      they don't turn hazy again in a month.
    price_from: [Headlight Restoration]
    button: Add to detail
    services: [Headlight Restoration]
    cta_heading: Restore your headlights
    old_pages: [headlight-restoration]
  - anchor: extraction
    title: Shampoo & Extraction
    card: >-
      For carpets and cloth seats that need a deeper cleaning. Add this to any
      interior detail service to pull out smells and filth that have embedded
      deep into the seats or carpet.
    price_from: [Carpet Extraction, Seat Extraction]
    button: Add to detail
    services: [Carpet Extraction, Seat Extraction]
    cta_heading: Book your detail today
    old_pages: [shampoo-and-extraction]

services:
  - name: Full Detail
    section: detail
    takes_condition: true
    heading: Full Detail
    card: >-
      Every corner, inside and out: paint, undercarriage, engine, wheels,
      seats, trunk and door jambs.
    full: >-
      Dixie Detail takes pride in delivering a full-service cleaning that
      meticulously reaches every corner of your car, inside and out. This
      isn't just a quick vacuum and wipe down. You're getting the full
      treatment to get your car looking showroom new again. Paint,
      undercarriage, engine, wheels, between and under seats, trunk, door
      jambs, every crevice – we do it all.

  - name: Interior Only
    section: detail
    takes_condition: true
    heading: Interior Detail
    card: >-
      Our premium detail for the inside: every crevice deep cleaned, surfaces
      renewed, a thorough vacuum and spot cleaning of carpets and cloth.
    full: >-
      Our premium detail service focused on just the interior of your
      vehicle. Every crack and crevice gets deep cleaned, surfaces renewed,
      and a thorough vacuum in, under, and around everything. Spot cleaning
      of cloth/carpets is included. Shampoo and heavy extraction available
      for an extra charge.

  - name: Exterior Only
    section: detail
    heading: Exterior Detail
    card: >-
      Our premium detail for the outside: multistage paint wash, ceramic wax,
      undercarriage, engine bay, wheels and streak-free glass.
    full: >-
      Our premium detail service focused on just the exterior of your
      vehicle. This service delivers a multistage paint wash followed by a
      ceramic wax. We also wash the undercarriage, engine bay, wheels, wheel
      wells, and gas cap compartment. Glass gets a streak-free clean and the
      tires and plastics are dressed.

  - name: 1-Step Paint Correction
    section: correction
    heading: Paint Decontamination + 1-Step Correction
    card: >-
      The best value for most cars: decontamination, one polishing pass that
      removes or reduces most defects, and a ceramic wax.
    full: >-
      The 1-Step Paint Correction is the right fit for most situations. It's
      the best bang for your buck, striking a good balance between cost and
      results. Paint correction starts with a 3-step wash: presoak, hand
      wash, and clay bar to remove embedded contamination. Then we make one
      pass around the vehicle using a medium polish and pad. This will
      eliminate or reduce most defects and leave a nice shine delivering a
      significant improvement in clarity and gloss. The service is completed
      with a final wash and a ceramic wax to protect your newly-corrected
      paint.

  - name: 2-Step Paint Correction
    section: correction
    heading: Paint Decontamination + 2-Step Correction
    card: >-
      For a high-gloss showroom finish: decontamination, a cutting pass for
      deeper defects, a fine polish to a mirror shine, and a ceramic wax.
    full: >-
      The 2-Step Paint Correction is needed when a high-gloss showroom finish
      is the goal. It's also the right fit when paint requires the extra
      cutting step to get more aggressive at removing imperfections. Paint
      correction starts with a 3-step wash: presoak, hand wash, and clay bar
      to remove embedded contamination. Then a first pass around the vehicle
      with a specific compound and pad combination tailored to the
      correction need, and a second pass with a fine polish to buff out a
      mirror shine. The service is completed with a final wash and a ceramic
      wax to protect your newly-corrected paint.

  - name: Carpet Extraction
    section: extraction
    heading: Carpet Extraction
    add_on: true
    card: Forced extraction pulls dirt, stains and odors out of your carpet.
    full: >-
      The main source of filth, bacteria, and foul smell in most cars is the
      carpet. Every nasty thing that has ever been on the bottom of your
      shoes has been absorbed into your carpet. The occasional beverage
      spill just adds to the Petri dish. The best method to fully remove
      dirt and contaminants is with forced extraction. Your car will smell
      better and the ugly stains will fade or disappear completely. Priced
      by the number of seat rows in your vehicle.

  - name: Seat Extraction
    section: extraction
    heading: Seat Extraction
    add_on: true
    card: Deep cleaning and extraction that pulls years of grime out of cloth seats.
    full: >-
      Cloth seats are comfortable, but they're notoriously difficult to
      clean. They're like a sponge absorbing dirt, spills, sweat, and grime.
      Over time, stains start to show and the seats just look generally
      grungy, bringing down the look of the whole interior. Our cleaning
      process involves purpose-formulated cleaners and powerful extraction
      to pull years of filth out of your seats. Your seats will look new
      again, matching your freshly detailed interior. Priced by the number
      of seat rows in your vehicle.

  - name: Headlight Restoration
    section: headlight
    heading: Headlight Restoration
    add_on: true       # added to Full Detail, Exterior Only or a paint correction (decision 0106)
    card: >-
      Foggy, yellowed lenses restored to clear, with UV protection so they
      stay that way. Covers both headlights. Add it to a Full Detail,
      Exterior Only or paint correction.
    full: >-
      Over time, headlights become foggy and yellowed due to UV damage,
      environmental exposure, and normal wear and tear when driving. Dull
      headlights can be restored to showroom clarity with the proper tools
      and technique. This is more than a temporary polish. We perform a
      multi-stage process to remove the damaged outer layer, buff the lens,
      and add UV protection to ensure lasting results. This service covers
      both headlights, and is added to a Full Detail, Exterior Only, 1-Step
      or 2-Step Paint Correction.

  - name: Motorcycle Detail
    section: detail
    heading: Motorcycle Detail
    only_for: [Motorcycles]   # the classes it's for; the other services are for every other class (quote request card)
    card: >-
      A meticulous multi-stage wash around every critical component, finished
      with a ceramic wax for a deep shine.
    full: >-
      Our premium detail package to get your bike looking showroom new
      again. We perform a meticulous multi-stage wash around all of the
      critical components of your bike and finish with a ceramic wax to
      bring out that deep shine.

# Condition levels (owner's rules, 2026-11-14): they apply only to services that
# cover the interior (Full Detail and Interior Only; takes_condition below), and
# the condition step comes after the service step. Level 1 is preselected and
# adds nothing; Level 2 adds 10%; Level 3 is booked by quote (no price shown).
condition_levels:
  - level: 1
    name: Normal wear and tear
    default: true
    card: >-
      Vehicle is maintained, but needs a reset. No major messes or spills.
      Standard wear and tear from family. Some light pet hair. The car looks
      used and we want it to look new again.
  - level: 2
    name: Needs extra attention
    estimate: Needs Attention     # the estimate card's line: "Needs Attention (+10%)", the percentage from the price book
    card: >-
      Vehicle needs attention from a professional. It's been a while since
      the last cleaning and things have gotten messy. Kids, dogs, and dirt
      roads have left their mark.
  - level: 3
    name: Let's talk
    card: >-
      Heavy contamination from major spills or significant dirt buildup over
      the years. Significant dog hair, heavy stains, or possibly mold.
    booked_by_quote: true
    quote_note: >-
      Unique situations require manual quoting. Hit the button below to tell
      us what you're dealing with and add photos if you can. We'll respond
      with a quote, usually within 24 hours.
    request_intro: >-
      Unique situations require a manual estimate. Give us some details about
      the job and we'll reply with a price, usually within a day.

# A vehicle in a class booked by quote (owner, 2026-11-18): the booking
# flow's step 1 note above its "Request quote" button, and the quote request
# card's intro, where {class} is the class's name (Full-size Vans).
quote_class:
  note_heading: Full-size vans vary in size and condition.
  note: Request a quote and we'll reply with your estimate, usually within a day.
  request_intro: >-
    {class} vary in size and condition and require a manual estimate. Give us
    some details about the job and we'll reply with a price, usually within a
    day.

# The Google Business Profile review link (from the owner, 2026-11-14) is
# google_business_profile in data/business.yaml. One link serves the footer
# icon, the reviews page and (in Phase 4) review-request texts.

# Vehicle class card pictures: the owner's choice (2026-11-14), white
# vehicles in a front three-quarter view, 640x480 WebP with transparent
# backgrounds. The owner was told these are third-party renders he holds no
# license for; swap a file here if he replaces one.
# The files are in site/public/images/vehicle-classes/, served at
# /images/vehicle-classes/<file>, the path a class's photo card picture uses.
class_images:
  Small: vehicle-class-small.webp
  Medium: vehicle-class-medium.webp
  Large: vehicle-class-large.webp
  Full-size: vehicle-class-fullsize.webp
  Full-size Vans: vehicle-class-vans.webp
  Light Pickups: vehicle-class-lightpickup.webp
  Full-size Trucks: vehicle-class-fullsizetruck.webp
  Motorcycles: vehicle-class-motorcycles.webp

# Section photos (owner, 2026-11-14), one per section: on the services page
# and, square, on the homepage service cards. The detailing photo was
# replaced on 2026-11-18. The motorcycle text joined Premium Detailing on
# 2026-11-18, so its photo is no longer shown. The site makes smaller sizes
# itself and never shows a photo larger than its own pixels.
# The files are in site/src/assets/page-photos/.
section_images:
  detail: detailing.webp
  correction: paint-correction.webp
  headlight: headlight-restoration.webp
  extraction: seat-extraction.webp

# The homepage's "Services and pricing" subhead and the services page's top
# (owner, 2026-11-18).
home_services_lead: >-
  We provide upfront pricing right here on our website. Pick your vehicle,
  see the exact price with tax, and pick a day that works for you. We show up
  and handle the rest.
services_page:
  heading: Mobile Detailing Services
  lead: >-
    We come to your driveway in Bradley, McMinn, Hamilton, Polk, and Meigs
    Counties.

# The two policy pages: Text Message Terms as published; Privacy Policy from
# the doc "Privacy Policy update for the new website" (final 2026-11-14).
# They are site/src/pages/sms-terms.md and site/src/pages/privacy-policy.md,
# served at /sms-terms/ and /privacy-policy/ (data/business.yaml, policy_pages).
