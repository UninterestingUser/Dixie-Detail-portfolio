meta:
  title: Outside services
  summary: Every outside service the system uses or will use, with its purpose, phase and status.
  updated: 2026-11-21
  status: current
  explained_in: docs/architecture/integrations.md

services:
  - name: Cloudflare
    purpose: DNS for dixiedetail.com, the Tunnel, and website hosting on Pages
    phase: 0
    status: In use; tunnel dixie-detail with route api.dixiedetail.com
    plan: Free
  - name: Cloudflare Turnstile
    purpose: Checks that bookings, quote requests and photo upload sessions come from a person (docs/reference/public-api.md)
    phase: 3
    status: Working (Phase 3, Steps 4 and 6); one widget in Managed mode for dixiedetail.com and the staging address, its secret key the Bitwarden secret TURNSTILE_SECRET_KEY and its site key the Pages build variable PUBLIC_TURNSTILE_SITE_KEY
    plan: Free
  - name: Tailscale
    purpose: Private access to the control app
    phase: 0
    status: In use; server is a node; control app published with tailscale serve
  - name: Bitwarden Secrets Manager
    purpose: Every key, password and token
    phase: 0
    status: In use; project Dixie Detail, machine account server (access token labeled dixie-server)
  - name: GitHub
    purpose: Private repository; server pulls with a read-only deploy key
    phase: 0
    status: In use
  - name: Google Workspace Drive
    purpose: Encrypted off-site backups through rclone and restic
    phase: 0
    status: In use
  - name: Healthchecks.io
    purpose: Alerts when the backup, the public path, the monthly vehicle data refresh, the morning sales tax rate check or the nightly calendar check stops checking in or fails, and when a tax rate change waits for approval
    phase: 0
    status: In use; six checks, one pinged by the offline replay Worker (docs/operations/monitoring.md)
    plan: Free
  - name: EPA FuelEconomy.gov
    purpose: Year, make, model, size class, drive, body styles and passenger and luggage volume, from 1984
    phase: 2
    status: Working; import_vehicle_data --source epa loads the whole table; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer
    url: https://www.fueleconomy.gov/feg/epadata/vehicles.csv.zip
    plan: Free, no key
  - name: NHTSA vPIC
    purpose: Makes and models the EPA leaves out (heavy pickups and vans) and motorcycle models, from GetModelsForMakeYear; no seat-row data yet (its seat-row fields are per VIN)
    phase: 2
    status: Working; import_vehicle_data --source vpic, for the makes in data/vehicle-data-import.yaml; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer
    url: https://vpic.nhtsa.dot.gov/api/vehicles/
    plan: Free, no key; rate-limited, so the import pauses between calls and retries 429 and 5xx answers
  - name: NHTSA vPIC Canadian vehicle specifications
    purpose: Curb weight, overall length, width, height and wheelbase per trim, and pickups' cab styles from the trim names, for the classification rules (GetCanadianVehicleSpecifications)
    phase: 2
    status: Working; import_vehicle_data --source canada attaches them to matching catalog models and lists the rest; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer. Checked by hand on 2026-10-17 against a 2019 Toyota RAV4 and the 2025 Ford range. Models sold only in the US may be missing
    url: https://vpic.nhtsa.dot.gov/api/vehicles/
  - name: Google Workspace Calendar
    purpose: Jobs and Time Off calendars, through a service account with the calendar.events scope only; the app writes Jobs and reads Time Off (decisions 0057 and 0098)
    phase: 3
    status: Working (Phase 3, Step 3, connected 2026-11-08) through the service account, its key the Bitwarden secret GOOGLE_SERVICE_ACCOUNT_JSON - a queue in PostgreSQL, the calendar-worker container pushing changes within seconds and copying Time Off every 5 minutes, and dixie-calendar-check.timer running the full check nightly at 3:35 AM (docs/operations/connecting-the-google-calendars.md)
    plan: Free with Google Workspace; the Calendar API has no charge
  - name: Google Maps Platform
    purpose: Address suggestions (Places API (New) Autocomplete, in the browser), the server's lookup of the picked address (Place Details, Essentials fields only), Text Search (place IDs only) for typed addresses the Census geocoder cannot find, traffic-aware drive times (Routes), and the homepage's service area map (Maps Embed API, view mode, in the browser)
    phase: 3
    status: Working (Phase 3) - the server key GOOGLE_MAPS_SERVER_KEY for Place Details, Text Search and Routes, and the browser key in the site's build settings for autocomplete and the Maps Embed API. The app's caps sit below the Google limits and every call is counted (decisions 0091 and 0092). The account is on Google's free trial, which locks the quotas, so the daily limits (322 for each Places method, 161 for Routes) are set the day it is upgraded, by 2027-01-15
    plan: Free trial until about 2027-02-03; then pay as you go within the free monthly amounts; the Maps Embed API has no charge
  - name: US Census Bureau geocoder
    purpose: Coordinates and county for addresses the owner types, and for the home base; verify_addresses checks existing addresses with it
    phase: 3
    status: Working (Phase 3, Step 1); calls counted, no cap
    url: https://geocoding.geo.census.gov/geocoder/
    plan: Free, no key
  - name: Tennessee Department of Revenue
    purpose: Local sales tax rates and rate boundaries, from its map service, updated quarterly
    phase: 3
    status: Working (Phase 3, Step 1); import_tax_rates loads them, and dixie-tax-rate-check.timer checks the rates every morning at 5:15 AM (decision 0090)
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/REVENUE_TAX_RATE_BOUNDARIES/MapServer
    plan: Free, no key
  - name: Cloudflare Pages
    purpose: Hosts the Astro website, built from site/ in this repository, with the request a time form's Pages Function
    phase: 3
    status: Working (Phase 3, Step 6) on the staging address until launch; the deploy hook CLOUDFLARE_PAGES_DEPLOY_HOOK rebuilds the site when a pricebook version is published or takes effect, and when reviews change (docs/guides/previewing-and-deploying-the-website.md)
    plan: Free
  - name: Cloudflare Workers and Workers KV
    purpose: Holds request a time forms while the server or Google can't be reached, and replays them to the public API every 5 minutes (the offline-replay Worker and its KV namespace, decision 0105)
    phase: 3
    status: Working (Phase 3, Step 6)
    plan: Free
  - name: Quo
    purpose: Calls, owner texts and automated texts
    phase: 3-5
    status: Planned for Phase 4. Account open on a new number, Starter plan; carrier registration not yet submitted (the booking form with its consent checkbox is on the staging site, so it can start); business number not ported
  - name: Stripe
    purpose: Card payment links, Cash App Pay, Tap to Pay
    phase: 4
    status: Planned for Phase 4. Owner to confirm the account is in the business's name and test Tap to Pay
  - name: GnuCash
    purpose: General ledger, fed by a multi-split CSV export
    phase: 6
    status: Chart of accounts mapped and cleaned up (2026-10-11)
  - name: BTCPay Server
    purpose: Bitcoin invoices
    phase: 7
    status: Planned for Phase 7

considered_not_used:
  - name: Directus
    reason: "Pricing, availability and promotions need custom code either way"
  - name: Twilio
    reason: "No phone app; calls would need a second service"
  - name: UptimeRobot
    reason: "Free plan is non-commercial since October 2024"
  - name: Backblaze B2
    reason: "Google Drive storage is already paid for"
  - name: RockAuto
    reason: "No public API; scraping may breach its terms"
