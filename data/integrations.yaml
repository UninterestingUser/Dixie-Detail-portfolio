meta:
  title: Outside services
  summary: Every outside service the system uses or will use, with its purpose, phase and status.
  updated: 2026-10-29
  status: current
  explained_in: docs/architecture/integrations.md

services:
  - name: Cloudflare
    purpose: DNS for dixiedetail.com, the Tunnel, and (Phase 3) website hosting on Pages
    phase: 0
    status: In use; tunnel dixie-detail with route api.dixiedetail.com
    plan: Free
  - name: Tailscale
    purpose: Private access to the control app
    phase: 0
    status: In use; server is a node; control app published with tailscale serve
  - name: Bitwarden Secrets Manager
    purpose: Every key, password and token
    phase: 0
    status: In use; project Dixie Detail, machine account server (access token labeled dixie-server)
  - name: GitHub
    purpose: Private repository; server pulls with a read-only deploy key
    phase: 0
    status: In use
  - name: Google Workspace Drive
    purpose: Encrypted off-site backups through rclone and restic
    phase: 0
    status: In use
  - name: Healthchecks.io
    purpose: Alerts when the backup, the public path or the monthly vehicle data refresh stops checking in or fails
    phase: 0
    status: In use; three checks
    plan: Free
  - name: EPA FuelEconomy.gov
    purpose: Year, make, model, size class, drive, body styles and passenger and luggage volume, from 1984
    phase: 2
    status: Working; import_vehicle_data --source epa loads the whole table; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer
    url: https://www.fueleconomy.gov/feg/epadata/vehicles.csv.zip
    plan: Free, no key
  - name: NHTSA vPIC
    purpose: Makes and models the EPA leaves out (heavy pickups and vans) and motorcycle models, from GetModelsForMakeYear; no seat-row data yet (its seat-row fields are per VIN)
    phase: 2
    status: Working; import_vehicle_data --source vpic, for the makes in data/vehicle-data-import.yaml; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer
    url: https://vpic.nhtsa.dot.gov/api/vehicles/
    plan: Free, no key; rate-limited, so the import pauses between calls and retries 429 and 5xx answers
  - name: NHTSA vPIC Canadian vehicle specifications
    purpose: Curb weight, overall length, width, height and wheelbase per trim, and pickups' cab styles from the trim names, for the classification rules (GetCanadianVehicleSpecifications)
    phase: 2
    status: Working; import_vehicle_data --source canada attaches them to matching catalog models and lists the rest; refreshed monthly, on the first Sunday at 4:15 AM Eastern, by dixie-vehicle-refresh.timer. Checked by hand on 2026-10-17 against a 2019 Toyota RAV4 and the 2025 Ford range. Models sold only in the US may be missing
    url: https://vpic.nhtsa.dot.gov/api/vehicles/
  - name: Google Workspace Calendar
    purpose: Jobs and Time Off calendars
    phase: 3
    status: Calendars created 2026-10-11; service account not yet connected
  - name: Google Maps Platform
    purpose: Address suggestions (Places Autocomplete) and traffic-aware drive times (Routes)
    phase: 3
    status: Billing account approved, not yet created
  - name: US Census Bureau geocoder
    purpose: Address to coordinates for sales tax
    phase: 3
    status: Not started
  - name: Tennessee Department of Revenue
    purpose: Tax rates and boundaries, updated quarterly
    phase: 3
    status: Not started
  - name: Quo
    purpose: Calls, owner texts and automated texts
    phase: 3-5
    status: Account open on a new number, Starter plan; carrier registration waits for the new booking form; business number not ported
  - name: Stripe
    purpose: Card payment links, Cash App Pay, Tap to Pay
    phase: 4
    status: Owner to confirm the account is in the business's name and test Tap to Pay
  - name: GnuCash
    purpose: General ledger, fed by a multi-split CSV export
    phase: 6
    status: Chart of accounts mapped and cleaned up (2026-10-11)
  - name: BTCPay Server
    purpose: Bitcoin invoices
    phase: 7
    status: Deferred

considered_not_used:
  - name: Directus
    reason: "Pricing, availability and promotions need custom code either way"
  - name: Twilio
    reason: "No phone app; calls would need a second service"
  - name: UptimeRobot
    reason: "Free plan is non-commercial since October 2024"
  - name: Backblaze B2
    reason: "Google Drive storage is already paid for"
  - name: RockAuto
    reason: "No public API; scraping may breach its terms"
