meta:
  title: Settings and secrets
  summary: Every run-time setting (in .env, not secret) and every secret (in Bitwarden, names only) the system uses, with purpose, consumer and phase.
  updated: 2026-11-22
  status: current
  explained_in: docs/reference/configuration.md
  rule: Values are never written here. Settings live in /srv/dixie-detail/.env; secrets live in the Bitwarden Secrets Manager project "Dixie Detail".
  reconcile: Phase 0 names checked against .env.example and ops/ on 2026-10-13. Later phases add their names in the pull request that uses them.

settings:
  - name: BWS_PROJECT_ID
    purpose: ID of the Bitwarden project "Dixie Detail" (from the end of the project page's address)
    used_by: ops/stack-start.sh, ops/backup.sh, ops/public-health.sh, ops/deploy.sh, ops/restore-test.sh, ops/restic.sh
    phase: 0
  - name: BWS_SERVER_URL
    example: https://vault.bitwarden.com
    purpose: Points bws at Bitwarden's US cloud; every script that calls bws stops without it
    used_by: ops/lib/bws.sh
    phase: 0
  - name: POSTGRES_DB
    example: dixie
    purpose: Database name, for the db container and the app
    phase: 0
  - name: POSTGRES_USER
    example: dixie
    purpose: Database user, for the db container and the app
    phase: 0
  - name: DJANGO_ALLOWED_HOSTS
    example: server.example-tailnet.ts.net,api.dixiedetail.com,127.0.0.1,localhost
    format: Bare host names separated by commas; no https:// and no spaces
    note: The app always accepts localhost as well, for its own health check. Each name except localhost and 127.0.0.1 is also trusted, as https://NAME, as an origin for sign-in and other forms (decision 0068)
    phase: 0
  - name: DEPLOY_REMOTE
    example: git@github.com:OWNER/Dixie-Detail.git
    purpose: Where ops/deploy.sh pulls from, over SSH with the deploy key
    phase: 0
  - name: DEPLOY_BRANCH
    example: main
    purpose: The branch ops/deploy.sh pulls
    phase: 0
  - name: BACKUP_DIR
    example: /mnt/raid/Backups/dixie-detail
    used_by: ops/backup.sh
    phase: 0
  - name: RESTIC_REPOSITORY
    example: rclone:gdrive:dixie-detail-backups
    used_by: ops/backup.sh, ops/restore-test.sh, ops/restic.sh
    phase: 0
  - name: RCLONE_CONFIG
    purpose: Path to the owner's encrypted rclone config, so the root-run backup finds it
    example: /home/OWNER/.config/rclone/rclone.conf
    note: .env.example shows /root/.config/rclone/rclone.conf; set it to wherever rclone config was run
    used_by: ops/backup.sh, ops/restore-test.sh, ops/restic.sh
    phase: 0
  - name: PUBLIC_HEALTH_URL
    example: https://api.dixiedetail.com/health
    used_by: ops/public-health.sh
    phase: 0
  - name: VEHICLE_DATA_CACHE_DIR
    example: /srv/vehicle-data
    purpose: The folder in the app container where import_vehicle_data caches its downloads, so a rerun does not fetch again
    default: /srv/vehicle-data, set in app/dixie/settings_base.py
    lives_in: not .env; the one-off import container mounts the host folder /srv/dixie-vehicle-data at the default path (see paths below)
    used_by: python manage.py import_vehicle_data
    phase: 2
  - name: GOOGLE_CALENDAR_JOBS_ID
    purpose: The Dixie Detail Jobs calendar's ID, from its Google Calendar settings under Integrate calendar. Not secret
    used_by: app and calendar-worker containers (compose.yaml); app/dixie/settings_base.py
    note: Empty until the calendars are connected; the sync then waits (docs/operations/connecting-the-google-calendars.md)
    phase: 3
  - name: GOOGLE_CALENDAR_TIME_OFF_ID
    purpose: The Dixie Detail Time Off calendar's ID, from its Google Calendar settings under Integrate calendar. Not secret
    used_by: app and calendar-worker containers (compose.yaml); app/dixie/settings_base.py
    note: Empty until the calendars are connected
    phase: 3
  - name: PUBLIC_API_CORS_ORIGINS
    example: https://dixiedetail.com,https://www.dixiedetail.com,https://dixie-detail.pages.dev
    purpose: The website's addresses, the only browser origins allowed to call the public API (CORS); empty refuses every browser
    format: Origins with https:// and a host name only, separated by commas. Spaces and a trailing slash are trimmed when the setting is read; any other path, or http://, stops the app from starting with a message naming the entry (app/dixie/origins.py). The app logs the origins in use at startup
    note: Until the Phase 5 launch it also lists the staging site's address, the Cloudflare Pages project's own pages.dev address (docs/guides/previewing-and-deploying-the-website.md)
    used_by: app container (compose.yaml); app/dixie/settings_base.py
    phase: 3
  - name: QUOTE_LIFETIME_MINUTES
    default: 120
    purpose: How long a website quote can be booked; an expired quote returns a fresh one to confirm (decision 0100)
    used_by: app container
    phase: 3
  - name: QUOTE_REQUEST_MAX_PHOTOS
    default: 6
    purpose: Photos per quote request (decision 0099)
    used_by: app container
    phase: 3
  - name: QUOTE_REQUEST_PHOTO_MAX_MB
    default: 15
    purpose: The largest quote request photo, as sent
    used_by: app container
    phase: 3
  - name: QUOTE_REQUEST_PHOTO_DAYS
    default: 90
    purpose: Days a quote request's photos are kept after it is declined, or its job is done or canceled
    used_by: app container (clean_public_api, run by dixie-api-cleanup.timer)
    phase: 3
  - name: PHOTO_DECODE_SECONDS
    default: 20
    purpose: Seconds the photo worker gives one quote request photo to decode before refusing it (decision 0123)
    used_by: photo-worker container
    phase: 3
  - name: PHOTO_DECODE_WAIT_SECONDS
    default: 90
    purpose: Seconds a photo upload waits for the photo worker's result before refusing the photo; room for a few photos ahead of it (decision 0123)
    used_by: public container
    phase: 3
  - name: SIGN_IN_LOCKOUT_FAILURES
    default: 5
    purpose: Failed control app sign-ins, for one username or from one address, that lock it out (decision 0124)
    used_by: app container
    phase: 3
  - name: SIGN_IN_LOCKOUT_WINDOW_MINUTES
    default: 15
    purpose: Minutes within which those failures count
    used_by: app container
    phase: 3
  - name: SIGN_IN_LOCKOUT_MINUTES
    default: 15
    purpose: Minutes a lockout lasts, unless a manager clears it
    used_by: app container
    phase: 3
  - name: ADDRESS_LOOKUP_SESSION_LOOKUPS
    default: 10
    purpose: Public address lookups one lookup session allows (decision 0115)
    used_by: app container
    phase: 3
  - name: ADDRESS_LOOKUP_SESSION_MINUTES
    default: 30
    purpose: Minutes an address lookup session lasts after it opens (decision 0115)
    used_by: app container
    phase: 3
  - name: TEST_PHONE_NUMBERS
    example: "4235550199"
    purpose: Mobile numbers whose website bookings and requests are marked test records; api_smoke_test books from the first
    format: 10-digit numbers separated by commas
    used_by: app container
    phase: 3
  - name: API_SMOKE_TEST_PLACE_ID
    purpose: The Google place ID of a public place in the service area where api_smoke_test books its test job; never a customer's address
    used_by: python manage.py api_smoke_test
    phase: 3
  - name: API_SMOKE_TEST_URL
    default: https://api.dixiedetail.com
    lives_in: not .env; the default in app/dixie/settings_base.py, or api_smoke_test --url
    phase: 3
  - name: GOOGLE_MAPS_BROWSER_KEY
    purpose: Public by design; used by the website's address field, restricted to the website's addresses (dixiedetail.com and the staging address) and to the Places API (New)
    lives_in: the Cloudflare Pages project's build settings as PUBLIC_GOOGLE_MAPS_BROWSER_KEY, not .env
    phase: 3

# The website's build settings, set on the Cloudflare Pages project
# (docs/guides/previewing-and-deploying-the-website.md). None is secret:
# each ends up in the public site, except API_BASE, which only the build reads.
website_build_settings:
  - name: API_BASE
    example: https://api.dixiedetail.com/api/public/v1
    purpose: The public API the build reads the pricebook, price table, photo cards and years from; the build fails rather than publish without prices
    note: Required, type Text on Cloudflare; an empty value stops the build with a message naming it (site/src/lib/settings.js). The server must be running while the site builds
  - name: PUBLIC_API_BASE
    example: https://api.dixiedetail.com/api/public/v1
    purpose: The public API the booking form calls from the browser; defaults to API_BASE
  - name: PUBLIC_TURNSTILE_SITE_KEY
    purpose: The Turnstile widget's site key, public; its secret key is the Bitwarden secret TURNSTILE_SECRET_KEY
    note: Required, type Text on Cloudflare; an empty value stops the build. Without it no form could be sent
  - name: PUBLIC_GOOGLE_MAPS_BROWSER_KEY
    purpose: The browser key for address suggestions (GOOGLE_MAPS_BROWSER_KEY above)
    note: Required, type Text on Cloudflare; an empty value stops the build
  - name: NODE_VERSION
    example: "24"
    purpose: The Node.js version Cloudflare builds with; matches site/.nvmrc
    note: Node 24 LTS (decision 0121); the build log names the version used
  - name: PUBLIC_OFFLINE_BASE, PUBLIC_TURNSTILE_SCRIPT, PUBLIC_PLACES_ENDPOINT
    purpose: Left unset on Cloudflare; the test build points them at local fakes (site/tests/build-for-tests.mjs)
  - name: QUO_PHONE_NUMBER
    phase: 4
  - name: BTCPAY_URL
    phase: 7
  - name: BTCPAY_STORE_ID
    phase: 7

secrets:
  - name: POSTGRES_PASSWORD
    purpose: Database password
    used_by: ops/stack-start.sh (db and app containers)
    phase: 0
    note: Earlier docs called it DB_PASSWORD; renamed to match the code on 2026-10-13. PostgreSQL reads it only when it first creates the database
  - name: DJANGO_SECRET_KEY
    purpose: Django's signing key
    used_by: ops/stack-start.sh (app container)
    phase: 0
  - name: CLOUDFLARE_TUNNEL_TOKEN
    purpose: Connects the cloudflared container to the dixie-detail tunnel
    used_by: ops/stack-start.sh (cloudflared container); required for the stack to start
    phase: 0
  - name: DEPLOY_SSH_KEY
    purpose: Read-only GitHub deploy key (private half, OpenSSH format)
    used_by: ops/deploy.sh and manual pulls, via ssh-agent
    phase: 0
    note: Phase 0 stored it in Bitwarden as DEPLOY_KEY; renamed in Bitwarden to match ops/deploy.sh on 2026-10-13
  - name: RESTIC_PASSWORD
    purpose: Encrypts the off-site backups
    used_by: ops/backup.sh, ops/restore-test.sh, ops/restic.sh
    phase: 0
    exception: Also kept in the owner's Bitwarden vault and as a sealed paper copy (decision 0041)
  - name: RCLONE_CONFIG_PASS
    purpose: Decrypts rclone's config, which holds the Google Drive sign-in
    used_by: ops/backup.sh, ops/restore-test.sh, ops/restic.sh
    phase: 0
  - name: HEALTHCHECKS_BACKUP_URL
    purpose: Ping address for the nightly backup check
    used_by: ops/backup.sh
    note: Optional; without it the backup runs with no pings
    phase: 0
  - name: HEALTHCHECKS_PUBLIC_URL
    purpose: Ping address for the public address check
    used_by: ops/health-credential.sh and ops/deploy.sh, which copy it into the systemd credential /etc/credstore.encrypted/dixie-healthchecks-public-url.cred that ops/public-health.sh reads (decision 0125)
    note: Required; the check fails without it. After changing it, run sudo ops/health-credential.sh
    phase: 0
  - name: HEALTHCHECKS_VEHICLE_REFRESH_URL
    purpose: Ping address for the vehicle data refresh check (docs/operations/monitoring.md)
    used_by: ops/vehicle-refresh.sh
    note: Optional; without it the monthly refresh runs with no pings
    phase: 2
  - name: HEALTHCHECKS_TAX_RATES_URL
    purpose: Ping address for the morning sales tax rate check (docs/operations/addresses-and-sales-tax.md)
    used_by: ops/tax-rate-check.sh
    note: Optional; without it the check runs with no pings. The check pings failure while a rate change waits for approval
    phase: 3
  - name: GOOGLE_SERVICE_ACCOUNT_JSON
    purpose: The calendar service account's JSON key, the whole file as the value; the app signs its Calendar API token requests with it (calendar.events scope only)
    used_by: ops/stack-start.sh (app and calendar-worker containers, as the file named by GOOGLE_SERVICE_ACCOUNT_JSON_FILE, in memory)
    note: Optional; until it exists the stack writes an empty file and the calendar sync waits. Decision 0098
    phase: 3
  - name: HEALTHCHECKS_CALENDAR_CHECK_URL
    purpose: Ping address for the nightly calendar check (docs/operations/monitoring.md)
    used_by: ops/calendar-check.sh
    note: Optional; without it the check runs with no pings
    phase: 3
  - name: HEALTHCHECKS_OFFLINE_URL
    purpose: Ping address for the offline requests check; the replay Worker pings it after each run, success or /fail (decision 0114, docs/operations/monitoring.md)
    used_by: the dixie-offline-replay Worker on Cloudflare, as a Worker secret put there from Bitwarden with wrangler secret put, without touching disk; never the server
    note: Optional; without it the Worker replays and logs that the run was not reported
    phase: 3
  - name: GOOGLE_MAPS_SERVER_KEY
    purpose: Server-side Google Maps Platform key for Place Details (looking up the address a customer picked), Text Search (finding a typed address the Census geocoder cannot) and Routes (drive times), restricted to the Places API (New) and the Routes API
    used_by: ops/stack-start.sh (app container, as the file named by GOOGLE_MAPS_SERVER_KEY_FILE)
    note: Optional; until it exists the stack writes an empty file and the app runs without Google (drive times estimated, website place lookups refused). Decision 0091
    phase: 3
  - name: TURNSTILE_SECRET_KEY
    purpose: The Cloudflare Turnstile widget's secret key; the server checks every booking, quote request and upload session's token with it (docs/reference/public-api.md)
    used_by: ops/stack-start.sh (app container, as the file named by TURNSTILE_SECRET_KEY_FILE, in memory)
    note: Optional for the stack to start; until it exists every booking and quote request is refused. The widget's site key is public and lives in the website's build settings. The same secret is also a secret of the Cloudflare Pages project, which checks the token on offline forms
    phase: 3
  - name: OFFLINE_REQUESTS_SIGNING_KEY
    purpose: A long random value shared with Cloudflare's offline piece, which signs each replayed "request a time" form with it (decision 0100)
    used_by: ops/stack-start.sh (app container, as the file named by OFFLINE_REQUESTS_SIGNING_KEY_FILE, in memory); Cloudflare's offline piece, as a secret of the Pages project and of the dixie-offline-replay Worker, put there from Bitwarden without touching disk
    note: Optional; until it exists offline requests are refused
    phase: 3
  - name: CLOUDFLARE_PAGES_DEPLOY_HOOK
    purpose: The Cloudflare Pages deploy hook URL; the app asks for a website rebuild when a pricebook version is published, and nightly when one takes effect (rebuild_website --if-due)
    used_by: ops/stack-start.sh (app container, as the file named by CLOUDFLARE_PAGES_DEPLOY_HOOK_FILE, in memory)
    note: Optional; until it exists no rebuild is asked for
    phase: 3
  - name: QUO_API_KEY
    phase: 4
  - name: QUO_WEBHOOK_SECRET
    phase: 4
  - name: STRIPE_SECRET_KEY
    phase: 4
  - name: STRIPE_WEBHOOK_SECRET
    phase: 4
  - name: BTCPAY_API_KEY
    phase: 7
  - name: BTCPAY_WEBHOOK_SECRET
    phase: 7

database_settings:
  rule: Settings the owner changes in the control app, kept in the database with change history, not in .env. Defaults are set in the code (app/geo/models.py).
  location_settings:
    - name: Home base
      purpose: Where drive times start; the owner's home, so it is never written to the repository or the docs
      screen: Account, Location settings (managers only)
      phase: 3
    - name: Place Details daily cap
      default: 300
      purpose: Google Place Details calls allowed per Pacific day, below the 322 a day set in Google Cloud
      phase: 3
    - name: Place Details public share
      default: 250
      purpose: Of the Place Details daily cap, the website's address lookups; the rest is kept for the control app and for offline requests looked up as they arrive (decision 0115)
      phase: 3
    - name: Text Search daily cap
      default: 300
      purpose: Google Text Search calls allowed per Pacific day, below the 322 a day set in Google Cloud; used for typed addresses the Census geocoder cannot find
      phase: 3
    - name: Routes daily cap
      default: 150
      purpose: Google Routes calls allowed per Pacific day, below the 161 a day set in Google Cloud; past it drive times are estimated
      phase: 3
    - name: Estimate road factor
      default: 1.30
      purpose: Road distance as a multiple of straight-line distance, for the estimated drive time
      phase: 3
    - name: Estimate speed
      default: 40 mph
      purpose: Average speed for the estimated drive time
      phase: 3
    - name: Drive time cache
      default: 30 days
      purpose: How long a drive time from Google is reused for the same two points and hour of the day
      phase: 3
    - name: Tax sourcing
      default: The service address's rate
      purpose: Decision 0025's single setting; the alternative is the home base's rate
      phase: 3
  sales_tax:
    - name: Per-state rates
      purpose: The rate for approved addresses outside Tennessee (Georgia 0%), seeded from data/service-area.yaml by import_tax_rates, then changed on the Sales tax screen with an effective date
      phase: 3

development:
  rule: Development and tests use made-up values written in app/dixie/settings_dev.py, never Bitwarden and never a real secret (decision 0045). The production image leaves that file out, and tools/run-tests.sh fails if it gets in.
  settings:
    - name: DJANGO_SETTINGS_MODULE
      purpose: Chooses the settings file
      production: dixie.settings (the default in manage.py and wsgi.py)
      tests: dixie.settings_dev (set by app/pytest.ini)
      phase: 1
    - name: CONTAINER_ENGINE
      purpose: Optional; forces tools/run-tests.sh to use podman or docker. Without it the script uses Podman, or Docker where Podman is not installed
      example: docker
      phase: 1
  made_up_values:
    - name: SECRET_KEY
      where: app/dixie/settings_dev.py
    - name: database password
      where: app/dixie/settings_dev.py and tools/run-tests.sh, which starts the throwaway database with it
    - name: GOOGLE_MAPS_SERVER_KEY
      where: app/dixie/settings_dev.py leaves it empty, so development never calls Google; tests use a made-up key with the HTTP call replaced by the answers in app/geo/test_files
    - name: GOOGLE_SERVICE_ACCOUNT_JSON
      where: app/dixie/settings_dev.py leaves it empty, so development never calls Google Calendar; tests use the fake calendar in app/calendars/testing.py
    - name: TURNSTILE_SECRET_KEY and OFFLINE_REQUESTS_SIGNING_KEY
      where: made-up values in app/dixie/settings_dev.py; the tests replace Cloudflare's siteverify call, and sign offline requests with the made-up key
    - name: TEST_PHONE_NUMBERS and PUBLIC_API_CORS_ORIGINS
      where: a made-up 555 number and the website's local development address in app/dixie/settings_dev.py

stored_on_server:
  - name: bws-token
    purpose: Access token (labeled dixie-server) for the Bitwarden machine account server
    location: /etc/credstore.encrypted/dixie-bws-token.cred
    protection: systemd-creds, --with-key=host+tpm2

paths:
  - name: Import folder
    host: /srv/dixie-import
    container: /srv/import
    purpose: The Baserow and Setmore exports and import-corrections.yaml for one import run, mounted read-only into a one-off app container; removed after each run
    holds_personal_data: true
    used_by: python manage.py import_baserow (docs/operations/importing-baserow.md)
    phase: 1
  - name: Vehicle data download cache
    host: /srv/dixie-vehicle-data
    container: /srv/vehicle-data
    purpose: The EPA, vPIC and Canadian specifications files import_vehicle_data downloads, kept between runs (setting VEHICLE_DATA_CACHE_DIR); outside the repository, owned by uid 10001, mounted read-write into a one-off app container; created by ops/deploy.sh when missing; safe to delete
    holds_personal_data: false
    used_by: python manage.py import_vehicle_data (docs/operations/importing-vehicle-data.md) and the monthly refresh, ops/vehicle-refresh.sh
    phase: 2
  - name: Quote request photos
    host: /srv/dixie-quote-photos
    container: /srv/quote-photos (setting QUOTE_PHOTO_DIR)
    purpose: The cleaned JPEGs customers send with quote requests, under random names (decision 0099); mounted read-write into the app container, owned by uid 10001, mode 0700; created by ops/deploy.sh; mirrored to BACKUP_DIR/quote-photos and sent to restic (tag photos) by the nightly backup
    holds_personal_data: true
    used_by: the public API and the control app's Website requests screen; clean_public_api deletes photos past their time
    phase: 3
