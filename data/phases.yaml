meta:
  title: Build phases
  summary: The eight build phases with their scope, done-when test and status.
  updated: 2026-10-22
  status: current
  explained_in: docs/overview/roadmap.md

phases:
  - number: 0
    name: Foundations
    status: done
    completed: 2026-10-14
    runbook: docs/operations/phase-0-foundations-runbook.md
    done_when: A backup has been restored successfully and the server answers through the tunnel
    note: Everything but the restore test was done on 2026-10-13; the restore test was deferred until the database had tables and passed on 2026-10-14
  - number: 1
    name: Core data and control app
    status: done
    completed: 2026-10-18
    runbook: docs/operations/phase-1-core-data-runbook.md   # historical, as executed
    note: The owner confirmed on 2026-10-18 that the done test passed. The returning-customer review queue moved to Phase 3 with quiet matching, because only website bookings raise its flags
    built:
      - Development setup and automated tests (pull request #14)
      - Data model for all nine areas built, with migrations and change history (2026-10-14)
      - Plan review applied, decisions 0056 to 0062 (pull request #18)
      - "Step 3: pricebook loaded from data/ (load_pricebook), pricing engine, time on site, quote record and pricebook versioning; the tests check all 90 cells of the price matrix"
      - "Step 4: Baserow and Setmore import (import_baserow), a dry run by default, keyed on Baserow ids; can be run again with fresh exports until launch"
      - "Control app shell and customer screens: phone-first and installable, sign-in over the tailnet address, customer search by name or phone, customer pages, adding and editing customers and vehicles"
      - "Control app job, staff and pricebook screens: day and week schedule, booking with a live price, maintenance series, final price; staff authorization and assign-staff control; pricebook drafts, publishing and affected-job choices (decisions 0061 and 0069)"
    plan_review_2026_10_17:     # decisions 0056 to 0062
      step_3: [service hours without setup and breakdown, quote record, time on site, room for another price basis]
      step_5b: [staff authorization per service, staff page and service page toggles, assigning staff from the qualified list]
    done_when: The pricebook in the app matches the price matrix cell for cell, and the imported history is searchable
    carry_overs_from_phase_0:
      - Add DEPLOY_REMOTE and DEPLOY_BRANCH to the server's .env before the first run of ops/deploy.sh (done; confirmed by the owner 2026-10-17, ops/deploy.sh works)
      - Once the first models exist, run "sudo ops/restore-test.sh" and confirm it passes (done 2026-10-14)
    done_in_docs_migration:
      - BWS_SERVER_URL added to .env.example and used by every script that calls bws
      - Secret names in .env.example and data/configuration.yaml match what ops/ fetches
      - Bitwarden secret DEPLOY_KEY renamed to DEPLOY_SSH_KEY (2026-10-13)
  - number: 2
    name: Vehicle catalog
    status: in progress
    built:
      - "Step 1: vehicle data import (import_vehicle_data) from the EPA, NHTSA vPIC (gap fill and motorcycles) and the Canadian specifications, with facts per model year and source (decision 0071)"
      - "Step 2: classification (classify_vehicles and the classify() lookup): ordered rules and per-model and per-vehicle overrides applied per model year, size variants by doors, cab style and the third-row list, the preview and the review queue; the Motorcycles class with Motorcycle Detail at $100 (decisions 0072 and 0073)"
      - "Step 2 follow-up: nameplates and one name per vehicle (data/vehicle-names.yaml), the full-size SUV overrides, the three-row rule, decisions by a two-thirds majority of rows, narrowed heavy-pickup and older-SUV rules, and launch rules that follow the data file (decision 0074)"
    scope_from_plan_review: [classification rules as data, per-model and per-vehicle overrides, preview before saving, vehicle class settings, vPIC Canadian specifications]
    done_when: The owner approves the class for every model in the job history and a spot-check list
  - number: 3
    name: Scheduling and website
    status: planned
    scope_from_plan_review: [scheduling settings screen, availability check, calendar sync and conflict rules, assign-staff prompt for website bookings]
    moved_from_phase_1: [returning-customer review queue, with quiet matching]
    done_when: The owner completes test bookings on the phone, estimates match the owner's own math, and the design is approved
  - number: 4
    name: Texts, alerts and payments
    status: planned
    scope_from_plan_review: [arrival and departure taps]
    done_when: One test appointment runs from booking through reminder, payment by every method and review request
  - number: 5
    name: Launch
    status: planned
    done_when: Old links redirect, a real customer books, and Setmore is switched off
  - number: 6
    name: Back office
    status: planned
    done_when: A month's export imports cleanly into GnuCash and matches the bank deposits
  - number: 7
    name: Bitcoin
    status: planned
    done_when: A test Bitcoin invoice marks its appointment paid

later_add_ons:              # not scheduled
  - name: Automatic arrival and departure
    what: Native Android companion app using Android geofencing (about 150 m around each job address)
    decision: "0062"

owner_actions_open:        # answers and checks only the owner can give
  # Carried over from the Phase 1 runbook; none blocks Phase 2.
  - Before Phase 2's classification rules are settled - whether to change how vehicles are priced (a factor beyond vehicle class, size variant and condition), cheapest to settle before the booking flow is built
  - Before Phase 3 - confirm or drop the quarter-hour rounding of a second Monthly job's start (decisions 0022 and 0056)
  - Before Phase 3 - the accountant's view on Georgia sales tax for the out-of-area customer, and whether Georgia work creates a Georgia income tax filing (decision 0037, docs/reference/sales-tax.md)
  - Before Phase 3 - short descriptions in the owner's own words for each service and condition level, for the website
  - Before Phase 3 - collect the Google Business Profile link for the website footer (data/business.yaml)
  # Before Phase 4 (docs/reference/payments.md).
  - Stripe account check and Tap to Pay test
  - Confirm Venmo and Cash App accounts are business profiles
