meta:
  title: Build phases
  summary: The eight build phases with their scope, done-when test and status.
  updated: 2026-11-19
  status: current
  explained_in: docs/overview/roadmap.md

phases:
  - number: 0
    name: Foundations
    status: done
    completed: 2026-10-14
    runbook: docs/operations/phase-0-foundations-runbook.md
    done_when: A backup has been restored successfully and the server answers through the tunnel
    note: Everything but the restore test was done on 2026-10-13; the restore test was deferred until the database had tables and passed on 2026-10-14
  - number: 1
    name: Core data and control app
    status: done
    completed: 2026-10-18
    runbook: docs/operations/phase-1-core-data-runbook.md   # historical, as executed
    note: The owner confirmed on 2026-10-18 that the done test passed. The returning-customer review queue moved to Phase 3 with quiet matching, because only website bookings raise its flags
    built:
      - Development setup and automated tests (pull request #14)
      - Data model for all nine areas built, with migrations and change history (2026-10-14)
      - Plan review applied, decisions 0056 to 0062 (pull request #18)
      - "Step 3: pricebook loaded from data/ (load_pricebook), pricing engine, time on site, quote record and pricebook versioning; the tests check all 90 cells of the price matrix"
      - "Step 4: Baserow and Setmore import (import_baserow), a dry run by default, keyed on Baserow ids; can be run again with fresh exports until launch"
      - "Control app shell and customer screens: phone-first and installable, sign-in over the tailnet address, customer search by name or phone, customer pages, adding and editing customers and vehicles"
      - "Control app job, staff and pricebook screens: day and week schedule, booking with a live price, maintenance series, final price; staff authorization and assign-staff control; pricebook drafts, publishing and affected-job choices (decisions 0061 and 0069)"
    plan_review_2026_10_17:     # decisions 0056 to 0062
      step_3: [service hours without setup and breakdown, quote record, time on site, room for another price basis]
      step_5b: [staff authorization per service, staff page and service page toggles, assigning staff from the qualified list]
    done_when: The pricebook in the app matches the price matrix cell for cell, and the imported history is searchable
    carry_overs_from_phase_0:
      - Add DEPLOY_REMOTE and DEPLOY_BRANCH to the server's .env before the first run of ops/deploy.sh (done; confirmed by the owner 2026-10-17, ops/deploy.sh works)
      - Once the first models exist, run "sudo ops/restore-test.sh" and confirm it passes (done 2026-10-14)
    done_in_docs_migration:
      - BWS_SERVER_URL added to .env.example and used by every script that calls bws
      - Secret names in .env.example and data/configuration.yaml match what ops/ fetches
      - Bitwarden secret DEPLOY_KEY renamed to DEPLOY_SSH_KEY (2026-10-13)
  - number: 2
    name: Vehicle catalog
    status: done
    completed: 2026-10-29
    runbook: docs/operations/phase-2-vehicle-catalog-runbook.md   # historical, as executed
    note: The owner applied the size-based classes and the new price book with apply_size_classes on 2026-10-28, worked through the booked-job review, the differences screen and the approval list, spot-checked every class, and passed the backup and restore test the same day
    built:
      - "Step 1 (#33): vehicle data import (import_vehicle_data) from the EPA, NHTSA vPIC (gap fill and motorcycles) and the Canadian specifications, with facts per model year and source (decision 0071)"
      - "Step 2 (#34): classification (classify_vehicles and the classify() lookup): ordered rules and per-model and per-vehicle overrides applied per model year, size variants by doors, cab style and the third-row list, the preview and the review queue; the Motorcycles class with Motorcycle Detail at $100 (decisions 0072 and 0073)"
      - "Step 2 follow-up (#35): nameplates and one name per vehicle (data/vehicle-names.yaml), the full-size SUV overrides, the three-row rule, decisions by a two-thirds majority of rows, narrowed heavy-pickup and older-SUV rules, and launch rules that follow the data file (decision 0074)"
      - "Step 3 (#36): the control app's catalog screens - lookup with facts, how and a test price; model and vehicle overrides and the third-row flag; rules in plain words with a preview before each change applies; class settings; the review queue with suggestions and many-at-once decisions; the change log on each model's screen (decision 0076). The owner's second dry-run fixes: unpublished EPA years take the nearest classified year, Canadian trims split by nameplate, the Wagoneer override from 2022 (decision 0075)"
      - "Step 4 (#37): link_vehicles links customers' vehicles to the catalog by the names data file, with trim words, never guessing between two candidates; the differences screen (keep the imported class, take the catalog's, or a per-model override); the two imported motorcycle jobs get the Motorcycles class and Motorcycle Detail with amounts as imported; the approval list of job-history, spot-check (data/approval-spot-checks.yaml) and mixed-class models, approved per year range and cleared by a later change (decisions 0077 to 0079)"
      - "Step 4 follow-up (#38): vehicles with no year link by make and model, keeping their class; the approval list's job history by make and model; customer aliases with year limits and other makes (Dodge Ram from 2011 is the Ram 1500); motorcycle-only makes get the Motorcycles class; a name check for every unlinked vehicle (decision 0080)"
      - "Step 5 (#39): monthly vehicle data refresh (refresh_vehicle_data, ops/vehicle-refresh.sh, dixie-vehicle-refresh.timer on the first Sunday of each month at 4:15 AM) with a third Healthchecks check; a refresh adds models and model years and updates facts, and holds class or size changes to models with an override, an approval or jobs in the review queue; the home screen shows the last refresh. Step 4 leftovers: the CLS alias points at CLS-Class, alias reasons no longer repeat the make, and names as the maker writes them (350Z) through the alias list (decision 0081)"
      - "deploy.sh enables every timer in ops/ on the deploy that adds it, and checks each is enabled and active (#40)"
      - "The vehicle size report, read-only, for the car, crossover and SUV classes (#41)"
      - "Size-based vehicle classes, rules and dry run: box volume as a stored fact, Small, Medium, Large, Full-size and Full-size Vans by box volume, seat rows instead of doors (decision 0082, #42)"
      - "apply_size_classes: the new price book and the size-based classes in one transaction, vans before pickups, the 760 cu ft pickup line, smoothing, three model overrides, retired body-type classes, photo cards and a new approval list; the price book check; the refresh classifies with the size rules and logs only its summary and newly queued models (decision 0083, #43)"
      - "Fixes from the apply dry runs: booked jobs with no vehicle, class or size are checked by hand (decision 0084, #44); seat rows, pickups in every year, full-size vans by nameplate and the Escalade override (decision 0085, #45); the three-row floor after seat rows are final (decision 0086, #46)"
      - "Size-based classes applied and the new price book published by the owner (2026-10-28)"
    scope_from_plan_review: [classification rules as data, per-model and per-vehicle overrides, preview before saving, vehicle class settings, vPIC Canadian specifications]
    done_when: The owner approves the class for every model in the job history and a spot-check list
  - number: 3
    name: Scheduling and website
    status: done
    completed: 2026-11-19
    runbook: docs/operations/phase-3-scheduling-and-website-runbook.md   # historical, as executed
    note: The owner finished acceptance on 2026-11-19 - test bookings on the Pixel through the staging site matched his own math, the design is approved, the test records are deleted, and the restore test passed with Phase 3's tables (122 of 122, plus the quote photos)
    scope_from_plan_review: [scheduling settings screen, availability check, calendar sync and conflict rules, assign-staff prompt for website bookings]
    built:
      - "Step 0 (#48): follow-ups from the 2026-11-03 server incident - the restore test never exits silently or leaves a restic lock, the kernel incident in troubleshooting.md, the kernel update procedure, and vehicle_size_report removed (decisions 0087 and 0088)"
      - "Step 0b (#49, docs follow-up #50): the off-site backup rides out a slow Google Drive - a 5-minute rclone open timeout, retries after 5 and 15 minutes, rclone limited to 5 Drive calls a second, and the procedure for switching to the business's own Google client (decision 0089)"
      - "Step 1 (#51, with #53 for addresses the Census geocoder can't match): verified addresses, the service area with approved out-of-area places, Tennessee sales tax rates and boundaries with the morning rate check, traffic-aware drive times with a marked fallback, and counted, capped Google calls (decisions 0090 to 0092)"
      - "Step 2 (#54): the scheduling settings in the database with change history and their screen, date exceptions, the booked jobs a change leaves outside the rules, the availability check, the manager override and the open-times view (decisions 0093 and 0094)"
      - "Step 2 follow-up (#55): booking off hours inline with the reason shown on the job, the Schedule, Day, 3 Days, Week and Month views, canceling or removing a job from a popup, canceled jobs in the Baserow import, and the customer list sorted by completed jobs (decisions 0095 and 0096)"
      - "Step 2 follow-up 2 (#56): the rules alert before the services are chosen, and the schedule's view bar (decision 0097)"
      - "Step 3 (#57): the Google Calendar sync - Jobs events and Drive to job blocks through a queue and the calendar worker, edits in Google put back, hand-added events flagged, Closed days, the Time Off copy every 5 minutes and at booking, clash flags on the home screen, the stale-copy warning, and the nightly full check with its Healthchecks ping (decision 0098)"
      - "Step 4 (#58): the public API under /api/public/v1/ (docs/reference/public-api.md) - the pricebook, vehicle lists, lookup and photo cards, verified addresses with approved out-of-area places, numbered quotes that expire, open times, bookings checked in one transaction under a per-day lock with consent wording recorded, quote requests with cleaned photos for classes booked by quote, signed offline requests, Turnstile, rate limits and CORS, test records, delete_test_records and api_smoke_test; the photo folder in the nightly backup and the restore test (decisions 0099 and 0100)"
      - "Step 5 (#59): website bookings in the control app - quiet matching of bookings and every request on the mobile number, the review queue with the four actions logged, the color telling identical vehicles apart, automatic assignment with the assign-staff prompt, a second vehicle the same day as a request, screens to price, book or decline quote requests, offline requests and second vehicle requests, the home screen's needs-you list, and api_smoke_test's returning and quote scenarios with --keep (decision 0101)"
      - "Step 5 follow-up (#60): removing a job keeps every quote something else refers to, a job removed as created by mistake reopens its request and a canceled one closes it, and delete_test_records deletes booked test quote requests with their quotes (decision 0102)"
      - "Step 6 prep (#61): service levels only for jobs that cover the interior, and Service Level 3 booked by quote (decision 0103); the site inputs moved into place (#63)"
      - "Step 6 (#65): the website on staging - the Astro site in site/ with every current address kept, pages per service and city, the FAQ, reviews and policy pages; prices, services and structured data from the public API at build time; the booking flow's seven steps with the estimate card, quote requests with photos, and the request a time form held and replayed by Cloudflare (a Pages Function, Workers KV and a scheduled Worker) while the server or Google can't be reached; GET price-table, offline quote requests and typed addresses on the server; rebuilds on publish and on a version's effective date; noindex until launch; browser tests and Lighthouse targets in CI (decision 0105)"
      - "Step 6 follow-ups: never hang on send, fail the build on missing settings, forgiving CORS origins (#66); the location step unlocks on the real API's answers, with a contract test keeping the fake API in step (#67)"
      - "The faster homepage (#69): a trimmed font, the inlined stylesheet and a 750-pixel hero"
      - "Acceptance changes A (#68): Headlight Restoration an add-on and each add-on only with the services the pricebook lists for it, with a manager's override in the control app; the default staff on every new booking; a needs-you list of decisions only, one item per job, with failing calendar syncs; the quote request Price section with time on site in hours and minutes and the crew as checkboxes; a dollar sign in the calendar file's total; one text consent instead of two (decisions 0106 to 0108)"
      - "Acceptance changes B (#70): the website - the menu backing, the larger logo, the four service cards, one /services/ page with anchored sections and redirects from the old addresses, the booking flow's wording and layout, and the one text consent checkbox with both policy pages updated"
      - "Acceptance changes C (#71, sent as acceptance changes #2): the header photo on every page except the homepage, the new Detailing photo, the service card photos, the page headings, the cab and third-row answers kept shown, size details only when asked, the add-on order, the quote request service list by class, and Turnstile fetched early and retried"
      - "Acceptance changes D (#72, sent as acceptance changes 3): the header crop, the homepage card text, section order, the Service Area map (Maps Embed API, loaded on approach) and the six common questions; reviews kept in the control app's Reviews screen and served by the public API; the city page headings; unavailable days grayed out in the date step; the quote request service order; Start over on the phone bar; one website payment list (decisions 0109 and 0110)"
      - "Side tasks during the phase: cloudflared pinned to 2026.10.2 (#52), CI pinned to Ubuntu 24.04 (#62), and the vehicle class pictures left out of the portfolio copy (#64, decision 0104)"
    moved_from_phase_1: [returning-customer review queue, with quiet matching]
    carried_from_phase_2:
      - The booking form shows the photo cards with the class pictures in site/public/images/vehicle-classes/ (done)
      - "Possible future vehicle classes already in data/vehicle-classes.yaml, not built: Oversized Vans & Trucks, RVs priced by the foot (a new price basis and a length question), and Boats by quote (a quote request on the booking form, which already handles any class booked by quote); each planned for a later phase"
    done_when: The owner completes test bookings on the phone, estimates match the owner's own math, and the design is approved
  - number: 4
    name: Texts, alerts and payments
    status: next
    scope_from_plan_review: [arrival and departure taps]
    done_when: One test appointment runs from booking through reminder, payment by every method and review request
  - number: 5
    name: Launch
    status: planned
    done_when: Old links redirect, a real customer books, and Setmore is switched off
  - number: 6
    name: Back office
    status: planned
    done_when: A month's export imports cleanly into GnuCash and matches the bank deposits
  - number: 7
    name: Bitcoin
    status: planned
    done_when: A test Bitcoin invoice marks its appointment paid

later_add_ons:              # not scheduled
  - name: Automatic arrival and departure
    what: Native Android companion app using Android geofencing (about 150 m around each job address)
    decision: "0062"

owner_actions_open:        # answers and checks only the owner can give
  # Carried over from the Phase 2 runbook.
  - Before the booked job on 2026-11-28 - attach the vehicle to the job when the customer says what it is, then settle its price on the booked-job review
  - At each vehicle's next visit - confirm the year of each customer vehicle flagged "year needed", which took its model's newest generation's class (decision 0083)
  # Carried over from the Phase 3 runbook.
  - Phase 4, start now - Quo carrier registration, with the answers in docs/reference/text-messages.md (one consent checkbox, no promotional texts). The reviewers must see the consent checkbox at the address given, which is the staging site until launch
  - Phase 4, by 2027-01-15 - the Google Cloud free trial ends about 2027-02-03. Upgrade the account by 2027-01-15 and set the daily quota caps the same day (each free monthly amount divided by 31 - 322 Places autocomplete, 322 Place Details Essentials, 161 Routes); the Maps calls stop if the trial ends first
  - Phase 4 - switch the off-site backup's rclone remote to the business's own Google OAuth client, following docs/operations/backups-and-restore.md. Drive's rate-limit errors on rclone's shared client continue, though the retries still succeed
  - Ongoing - the server stays on the pinned kernel until a newer one passes the test in docs/operations/updating-the-kernel.md. Filing the Launchpad bug is optional
  - Before Phase 5 - ask the accountant about Georgia sales and income tax for the out-of-area customer (decision 0037), and how Tennessee sources sales tax for a mobile service (docs/reference/sales-tax.md)
  - Before Phase 5 - confirm the licenses of the five service page photos, believed to be royalty-free stock. The vehicle class pictures are renders the business holds no license for (the owner's decision, decision 0104); the original SVG drawings are kept outside the repository as a swap
  - Phase 5 - the new Privacy Policy and Text Message Terms take the effective date of the day the new site goes live. The WordPress pages stay as they are until the cutover
  - Always - reviews live only in the control app's Reviews screen (decision 0109). They never go in data files, fixtures or the portfolio copy
  # Before Phase 4 (docs/reference/payments.md).
  - Stripe account check and Tap to Pay test
  - Confirm Venmo and Cash App accounts are business profiles
