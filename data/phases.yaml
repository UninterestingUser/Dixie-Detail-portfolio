meta:
  title: Build phases
  summary: The eight build phases with their scope, done-when test and status.
  updated: 2026-10-17
  status: current
  explained_in: docs/overview/roadmap.md

phases:
  - number: 0
    name: Foundations
    status: done
    completed: 2026-10-14
    done_when: A backup has been restored successfully and the server answers through the tunnel
    note: Everything but the restore test was done on 2026-10-13; the restore test was deferred until the database had tables and passed on 2026-10-14
  - number: 1
    name: Core data and control app
    status: in_progress
    progress:
      - Development setup and automated tests (pull request #14)
      - Data model for all nine areas built, with migrations and change history (2026-10-14)
      - Plan review applied, decisions 0056 to 0062 (pull request #18)
      - "Step 3: pricebook loaded from data/ (load_pricebook), pricing engine, time on site, quote record and pricebook versioning; the tests check all 90 cells of the price matrix"
    plan_review_2026_10_17:     # decisions 0056 to 0062
      step_3: [service hours without setup and breakdown, quote record, time on site, room for another price basis]
      step_5b: [staff authorization per service, staff page and service page toggles, assigning staff from the qualified list]
    done_when: The pricebook in the app matches the price matrix cell for cell, and the imported history is searchable
    carry_overs_from_phase_0:
      - Add DEPLOY_REMOTE and DEPLOY_BRANCH to the server's .env before the first run of ops/deploy.sh (done; confirmed by the owner 2026-10-17, ops/deploy.sh works)
      - Once the first models exist, run "sudo ops/restore-test.sh" and confirm it passes (done 2026-10-14)
    done_in_docs_migration:
      - BWS_SERVER_URL added to .env.example and used by every script that calls bws
      - Secret names in .env.example and data/configuration.yaml match what ops/ fetches
      - Bitwarden secret DEPLOY_KEY renamed to DEPLOY_SSH_KEY (2026-10-13)
  - number: 2
    name: Vehicle catalog
    status: planned
    scope_from_plan_review: [classification rules as data, per-model and per-vehicle overrides, preview before saving, vehicle class settings, vPIC Canadian specifications]
    done_when: The owner approves the class for every model in the job history and a spot-check list
  - number: 3
    name: Scheduling and website
    status: planned
    scope_from_plan_review: [scheduling settings screen, availability check, calendar sync and conflict rules, assign-staff prompt for website bookings]
    done_when: The owner completes test bookings on the phone, estimates match the owner's own math, and the design is approved
  - number: 4
    name: Texts, alerts and payments
    status: planned
    scope_from_plan_review: [arrival and departure taps]
    done_when: One test appointment runs from booking through reminder, payment by every method and review request
  - number: 5
    name: Launch
    status: planned
    done_when: Old links redirect, a real customer books, and Setmore is switched off
  - number: 6
    name: Back office
    status: planned
    done_when: A month's export imports cleanly into GnuCash and matches the bank deposits
  - number: 7
    name: Bitcoin
    status: planned
    done_when: A test Bitcoin invoice marks its appointment paid

later_add_ons:              # not scheduled
  - name: Automatic arrival and departure
    what: Native Android companion app using Android geofencing (about 150 m around each job address)
    decision: "0062"

owner_actions_open:
  - Stripe account check and Tap to Pay test
  - Confirm Venmo and Cash App accounts are business profiles
  - Collect the Google Business Profile link for the footer
  - Accountant check on Georgia sales and income tax for the out-of-area customer
