meta:
  title: Vehicle classes
  summary: The eight size-based vehicle classes that set prices, each class's settings (what the size variant measures, online booking, photo card and its example models), the retired body-type classes kept for history, the rule settings, and the possible future classes.
  updated: 2026-10-28
  status: current
  explained_in: docs/reference/vehicle-classification.md
  note: >-
    The size-based classes the owner chose on 2026-10-26 (decision 0082) and applied with
    apply_size_classes (decision 0083). In the database, vehicle classes and their size variants are
    records the owner can add, rename or retire without a code change
    (docs/architecture/data-model.md); load_pricebook creates the classes and their settings from this
    file. The rules and model overrides that give each model year its class are in
    data/size-classes.yaml.

classes:
  - name: Small
    size_variant_measures: seats
    size_variants: {1: one row, 2: two rows}
    booking: online
    photo_card: Small cars, small crossovers and two-seaters
    photo_card_examples: [Civic, Corolla, Camry, Accord, Crosstrek]
    customer_asked: Only for an optional third row
  - name: Medium
    size_variant_measures: seats
    size_variants: {2: two rows, 3: three rows}
    booking: online
    photo_card: Midsize crossovers and small three-row vehicles
    photo_card_examples: [RAV4, CR-V, Equinox, Rogue, Sorento]
    customer_asked: Only for an optional third row
  - name: Large
    size_variant_measures: seats
    size_variants: {2: two rows, 3: three rows}
    booking: online
    photo_card: Midsize SUVs and minivans
    photo_card_examples: [Highlander, Pilot, Explorer, Odyssey, Sienna]
    customer_asked: Only for an optional third row
  - name: Full-size
    size_variant_measures: seats
    size_variants: {3: three rows}
    booking: online
    photo_card: Full-size SUVs
    photo_card_examples: [Tahoe, Yukon, Expedition, Suburban, Sequoia]
    customer_asked: Never
  - name: Full-size Vans
    size_variant_measures: none
    size_variants: {}
    booking: ask for a quote
    photo_card: Send us a photo for a quote
    photo_card_examples: []
    customer_asked: Never; quoted by hand
  - name: Light Pickups
    renamed_from: Light Pickups & Offroad
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    photo_card: Small and midsize pickups
    photo_card_examples: [Tacoma, Colorado, Frontier, Ranger, Maverick]
    customer_asked: Yes, unless the model year has one cab style
  - name: Full-size Trucks
    renamed_from: Fullsize Trucks
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    photo_card: Full-size pickups, including 2500 and 3500 series
    photo_card_examples: [F-150, Silverado, Ram 1500, Tundra, F-250]
    customer_asked: Yes, unless the model year has one cab style
    gaps_filled_by: NHTSA vPIC (2500 and 3500 series)
  - name: Motorcycles             # decision 0072
    size_variant_measures: none
    size_variants: {}
    booking: online
    photo_card: Motorcycles
    photo_card_examples: []
    customer_asked: Never; one price
    vehicle_type: motorcycle      # every catalog model with vehicle type motorcycle, from NHTSA vPIC

# The body-type classes the size-based ones replaced (decisions 0060 and
# 0082), retired by apply_size_classes on the switch: kept so past
# appointments, their quote lines and the job history keep the class they
# had, and never offered, quoted or priced again. load_pricebook creates
# them retired in an empty database, for the Baserow import.
retired_classes:
  - name: Coupes & Sedans
    size_variant_measures: doors
    size_variants: {1: "two doors: coupes, convertibles and two-door hatchbacks", 2: "four doors: sedans and four-door hatchbacks"}
    photo_card: Sedans, coupes, hatchbacks and convertibles
  - name: Crossovers & Wagons
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    photo_card: Small SUVs, crossovers and station wagons
  - name: Midsize SUVs
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    photo_card: Midsize SUVs
  - name: Fullsize SUVs & Minivans
    size_variant_measures: seat rows
    size_variants: {3: always three rows}
    photo_card: Full-size SUVs, minivans and vans

class_settings:            # decision 0060; on each vehicle class record, edited on the control app's class settings screen (decision 0076)
  size_variant_measures: [doors, cab style, seat rows, seats, none]
  booking: [online, ask for a quote]
  photo_card: the caption of the class's card, shown when a vehicle is not in the catalog, with its example models and a photo (a placeholder until the owner adds one)

# How a rule's condition is decided when a model year's rows (the EPA's
# engines and transmissions, the Canadian trims) disagree: by what at least
# this share of them say. Below it either way, the model year waits in the
# review queue with the split. 1 would need every row to agree.
rule_settings:
  majority_share: "2/3"
  # A model year the EPA has not published yet, such as next year's F-150
  # that only vPIC lists so far, takes the class and size of the model's
  # nearest classified year instead of going to the review queue (decision
  # 0075). It counts as unpublished when the EPA lists earlier years of the
  # model but not this one, and the year is among the EPA's newest this many
  # model years, or later. It is classified again when the EPA data arrives.
  epa_unpublished_years: 2

classification:            # decisions 0060, 0073, 0082 and 0083
  method: ordered list of owner-editable rules on stored facts (data/size-classes.yaml); the first match wins
  then: the pickup size line, the EPA size class fallback and smoothing (data/size-classes.yaml)
  stored: per model year, by classify_vehicles
  facts: [vehicle type, make, model, not model, model name words, model year, EPA size class, drive, body style, cab style, seat rows, vPIC vehicle type, GVWR, curb weight, length, width, height, wheelbase, passenger volume, luggage volume, box volume]
  example_rule: "box volume at least 580 cu ft and under 700 cu ft -> Large"
  overrides: [per model (beats every rule), per vehicle (one customer's lifted or modified vehicle; beats both)]
  review_queue_decisions: per model year, from the review queue; beat the rules, and a model override beats them
  review_queue: [no rule matches, sources disagree on a fact a rule tests, no clear majority of a model year's rows on a rule's condition (rule_settings.majority_share)]
  rule_change: previewed with every model year that would change class or size (the control app's rule screen, or classify_vehicles --dry-run), applied when the owner confirms; applies to new quotes only
  not_yet_published: a model year the EPA has not published takes the class of the model's nearest classified year (rule_settings.epa_unpublished_years)
  booking_input: year, make and model (VINs are not used for pricing)
  third_row_seating: data/third-row-seating.yaml first, then NHTSA where it has data; optional or unknown is asked

fallback: Vehicles not in the catalog (for example pre-1984 classics) choose from eight photo cards, one per class; Full-size Vans' card asks for a photo for a quote
possible_future_classes:
  - name: Oversized Vans & Trucks
    covers: trucks above the 350 series
    until_then: they stay in Full-size Trucks
  - name: RVs
    service: exterior only
    priced: per foot of length, which needs a new price basis (decision 0060)
  - name: Boats
    priced: a custom quote by size and work, outside the vehicle catalog
