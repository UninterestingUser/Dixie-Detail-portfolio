meta:
  title: Vehicle classes
  summary: The seven vehicle classes that set prices, each class's settings (what the size variant measures, online booking, photo card), the launch classification rules and model overrides, and the possible future classes.
  updated: 2026-10-22
  status: current
  explained_in: docs/reference/vehicle-classification.md
  note: >-
    The launch set. In the database, vehicle classes and their size variants are records the owner
    can add, rename or retire without a code change (docs/architecture/data-model.md); load_pricebook
    creates the classes and their settings from this file. classify_vehicles seeds the launch rules
    and model overrides from this file on its first run; after that the live rules and overrides are
    in the database, edited by the owner, and this file is updated when the launch set changes.

classes:
  - name: Coupes & Sedans
    size_variant_measures: doors
    size_variants:
      1: "two doors: coupes, convertibles and two-door hatchbacks"
      2: "four doors: sedans and four-door hatchbacks"
    booking: online
    photo_card: Sedans, coupes, hatchbacks and convertibles
    customer_asked: Only when the EPA lists the model with more than one body style, or as a hatchback, whose doors it does not give
    epa_size_classes: car classes
  - name: Crossovers & Wagons
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    booking: online
    photo_card: Small SUVs, crossovers and station wagons
    customer_asked: Only for an optional or unknown third row
    epa_size_classes: small SUVs and station wagons
  - name: Light Pickups & Offroad
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    photo_card: Small pickups and the Jeep Wrangler
    customer_asked: Yes, unless the model year has one cab style
    epa_size_classes: small pickups
    overrides_in: [Jeep Wrangler]
  - name: Midsize SUVs
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    booking: online
    photo_card: Midsize SUVs
    customer_asked: Only for an optional or unknown third row
    epa_size_classes: standard SUVs
  - name: Fullsize SUVs & Minivans
    size_variant_measures: seat rows
    size_variants: {3: always three rows}
    booking: online
    photo_card: Full-size SUVs, minivans and vans
    customer_asked: Never
    epa_size_classes: minivans and vans
    overrides_in: [Chevrolet Suburban, Ford Expedition, Toyota Sequoia]
  - name: Fullsize Trucks
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    photo_card: Full-size pickups, including 2500 and 3500 series
    customer_asked: Yes, unless the model year has one cab style
    epa_size_classes: standard pickups
    gaps_filled_by: NHTSA vPIC (2500 and 3500 series)
  - name: Motorcycles             # decision 0072
    size_variant_measures: none
    size_variants: {}
    booking: online
    photo_card: Motorcycles
    customer_asked: Never; one price
    vehicle_type: motorcycle      # every catalog model with vehicle type motorcycle, from NHTSA vPIC

class_settings:            # decision 0060; on each vehicle class record, edited in the Django admin until a control-app screen exists
  size_variant_measures: [doors, cab style, seat rows, none]
  booking: [online, ask for a quote]
  photo_card: the caption of the class's card, shown when a vehicle is not in the catalog

# The launch rules, tried in this order; the first whose conditions all hold
# gives the class (decision 0060). The facts a condition can test and their
# forms are in docs/reference/vehicle-classification.md. "none" matches a
# model year that no source gives a value for, such as a vPIC truck the EPA
# does not list. Weights are curb weights in pounds and lengths are in inches,
# from the Canadian specifications.
launch_rules:
  - name: Motorcycles
    class: Motorcycles
    conditions: {vehicle_type: [motorcycle]}
  - name: Full-size vans the EPA leaves out
    class: Fullsize SUVs & Minivans
    conditions:
      epa_size_class: [none]
      model: [Express, Savana, Transit, Sprinter, eSprinter, ProMaster, NV200, NV Cargo, NV Passenger, E-Series, Econoline]
    note: >-
      Full-size and fleet vans stay in Fullsize SUVs & Minivans until an Oversized Vans & Trucks class exists.
      A model name matches when the catalog name is it or begins with it, so ProMaster covers ProMaster 2500.
  - name: Heavy pickups the EPA leaves out
    class: Fullsize Trucks
    conditions: {epa_size_class: [none], source_vehicle_type: [Truck]}
    note: >-
      The 2500 and 3500 series, Super Duty and HD pickups from NHTSA vPIC. Trucks above the 350 series
      stay here until an Oversized Vans & Trucks class exists.
  - name: Minivans the EPA lists as station wagons or special purpose vehicles
    class: Fullsize SUVs & Minivans
    conditions:
      model: [Caravan, Grand Caravan, Town & Country, Town and Country, Voyager, Grand Voyager, Odyssey, Sienna, Previa,
              Quest, Villager, Windstar, Freestar, Aerostar, Astro, Venture, Montana, Silhouette, Trans Sport, Lumina APV,
              Lumina Minivan, Uplander, Relay, Terraza, MPV, Sedona, Entourage, Routan]
    note: Before 2001 the EPA lists some minivans as station wagons or special purpose vehicles.
  - name: Standard SUVs longer than 215 inches
    class: Fullsize SUVs & Minivans
    conditions:
      epa_size_class: [Standard Sport Utility Vehicle 2WD, Standard Sport Utility Vehicle 4WD]
      length: {over: 215}
    note: Extended-length SUVs such as the Yukon XL, Escalade ESV and Expedition MAX, alongside the Suburban override.
  - name: Small SUVs over 4,500 lb
    class: Midsize SUVs
    conditions:
      epa_size_class: [Small Sport Utility Vehicle 2WD, Small Sport Utility Vehicle 4WD]
      curb_weight: {over: 4500}
  - name: Older SUVs over 4,500 lb
    class: Midsize SUVs
    conditions:
      epa_size_class: &older_suvs [Sport Utility Vehicle - 2WD, Sport Utility Vehicle - 4WD, Special Purpose Vehicle,
                                   Special Purpose Vehicle 2WD, Special Purpose Vehicle 4WD, Special Purpose Vehicles,
                                   Special Purpose Vehicles/2wd, Special Purpose Vehicles/4wd]
      curb_weight: {over: 4500}
    note: Before 2013 the EPA does not split SUVs into small and standard, so their curb weight decides.
  - name: Older SUVs up to 4,500 lb
    class: Crossovers & Wagons
    conditions:
      epa_size_class: *older_suvs
      curb_weight: {up_to: 4500}
    note: An older SUV with no curb weight matches neither rule and waits in the review queue.
  - name: EPA car classes
    class: Coupes & Sedans
    conditions:
      epa_size_class: [Two Seaters, Minicompact Cars, Subcompact Cars, Compact Cars, Midsize Cars, Large Cars]
  - name: EPA small SUVs and station wagons
    class: Crossovers & Wagons
    conditions:
      epa_size_class: [Small Sport Utility Vehicle 2WD, Small Sport Utility Vehicle 4WD, Small Station Wagons,
                       Midsize Station Wagons, Midsize-Large Station Wagons, Large Station Wagons]
  - name: EPA small pickups
    class: Light Pickups & Offroad
    conditions:
      epa_size_class: [Small Pickup Trucks, Small Pickup Trucks 2WD, Small Pickup Trucks 4WD]
  - name: EPA standard SUVs
    class: Midsize SUVs
    conditions:
      epa_size_class: [Standard Sport Utility Vehicle 2WD, Standard Sport Utility Vehicle 4WD]
  - name: EPA minivans and vans
    class: Fullsize SUVs & Minivans
    conditions:
      epa_size_class: [Minivan - 2WD, Minivan - 4WD, Vans, Vans Passenger, "Vans, Cargo Type", "Vans, Passenger Type"]
  - name: EPA standard pickups
    class: Fullsize Trucks
    conditions:
      epa_size_class: [Standard Pickup Trucks, Standard Pickup Trucks 2WD, Standard Pickup Trucks 4WD,
                       Standard Pickup Trucks/2wd]

# The launch model overrides, which beat every rule (decision 0060).
model_overrides:
  - {make: Jeep, model: Wrangler, class: Light Pickups & Offroad, note: "Priced with the light pickups, by cab style"}
  - {make: Chevrolet, model: Suburban, class: Fullsize SUVs & Minivans, note: "The EPA lists it as a standard SUV"}
  - {make: Ford, model: Expedition, class: Fullsize SUVs & Minivans, note: "The EPA lists it as a standard SUV"}
  - {make: Toyota, model: Sequoia, class: Fullsize SUVs & Minivans, note: "The EPA lists it as a standard SUV"}

classification:            # decision 0060; built in Phase 2 Step 2 (decision 0073)
  method: ordered list of owner-editable rules on stored facts; the first match wins
  stored: per model year, by classify_vehicles
  facts: [vehicle type, make, model, model year, EPA size class, drive, body style, cab style, seat rows, vPIC vehicle type, GVWR, curb weight, length, width, height, wheelbase, passenger volume, luggage volume]
  example_rule: "EPA small SUV weighing over 4,500 lb -> Midsize SUVs"
  overrides: [per model (beats every rule), per vehicle (one customer's lifted or modified vehicle; beats both)]
  review_queue: [no rule matches, sources disagree on a fact a rule tests, the trims straddle a rule's condition]
  rule_change: previewed with every model year that would change class or size (classify_vehicles --dry-run); applies to new quotes only
  booking_input: year, make and model (VINs are not used for pricing)
  third_row_seating: data/third-row-seating.yaml first, then NHTSA where it has data; optional or unknown is asked

fallback: Vehicles not in the catalog (for example pre-1984 classics) choose from seven photo cards, one per class, Motorcycles among them
possible_future_classes:
  - name: Oversized Vans & Trucks
    covers: full-size and fleet vans, and trucks above the 350 series
    until_then: they stay in Fullsize SUVs & Minivans and Fullsize Trucks
  - name: RVs
    service: exterior only
    priced: per foot of length, which needs a new price basis (decision 0060)
  - name: Boats
    priced: a custom quote by size and work, outside the vehicle catalog
