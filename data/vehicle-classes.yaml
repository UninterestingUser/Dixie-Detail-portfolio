meta:
  title: Vehicle classes
  summary: The six vehicle classes that set prices, each class's settings (what the size variant measures, online booking, photo card) and the EPA size classes that map to them.
  updated: 2026-10-17
  status: current
  explained_in: docs/reference/vehicle-classification.md
  note: The launch set. In the database, vehicle classes and their size variants are records the owner can add, rename or retire without a code change (docs/architecture/data-model.md); update this file when the set changes.

classes:
  - name: Coupes & Sedans
    size_variant_measures: doors
    size_variants:
      1: "two doors: coupes, convertibles and two-door hatchbacks"
      2: "four doors: sedans and four-door hatchbacks"
    booking: online
    customer_asked: Only when a model is sold both ways
    epa_size_classes: car classes
  - name: Crossovers & Wagons
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    booking: online
    customer_asked: Only for an optional third row
    epa_size_classes: small SUVs and station wagons
  - name: Light Pickups & Offroad
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    customer_asked: Yes, unless the model has one cab style
    epa_size_classes: small pickups
    overrides_in: [Jeep Wrangler]
  - name: Midsize SUVs
    size_variant_measures: seat rows
    size_variants: {2: two rows, 3: three rows}
    booking: online
    customer_asked: Only for an optional third row
    epa_size_classes: standard SUVs
  - name: Fullsize SUVs & Minivans
    size_variant_measures: seat rows
    size_variants: {3: always three rows}
    booking: online
    customer_asked: Never
    epa_size_classes: minivans and vans
    overrides_in: [Chevrolet Suburban, Ford Expedition, Toyota Sequoia]
  - name: Fullsize Trucks
    size_variant_measures: cab style
    size_variants: {1: regular cab, 2: extended or crew cab}
    booking: online
    customer_asked: Yes, unless the model has one cab style
    epa_size_classes: standard pickups
    gaps_filled_by: NHTSA vPIC (2500 and 3500 series)

class_settings:            # decision 0060; edited in the control app from Phase 2
  size_variant_measures: [doors, cab style, seat rows, none]
  booking: [online, ask for a quote]
  photo_card: shown when a vehicle is not in the data

classification:            # decision 0060; built in Phase 2
  method: ordered list of owner-editable rules on stored facts; the first match wins
  facts: [EPA size class, body type, GVWR where known, curb weight, overall length, width, height, wheelbase, seat rows, doors, cab]
  example_rule: "EPA small SUV weighing over 4,500 lb -> Midsize SUVs"
  overrides: [per model (beats every rule), per vehicle (one customer's lifted or modified vehicle)]
  rule_change: previewed with every model that would change class; applies to new quotes only
  booking_input: year, make and model (VINs are not used for pricing)

fallback: Vehicles not in the data (for example pre-1984 classics) choose from six photo cards, one per class
not_classed: Motorcycles are kept as past records with no class; they are not on the price list, and may become a vehicle class later, from vPIC's motorcycle makes
possible_future_classes:
  - {name: Motorcycles, source: "NHTSA vPIC motorcycle makes"}
  - {name: RVs and oversized vans, booking: ask for a quote, priced: by hand}
