meta:
  title: Vehicle names
  summary: The names customers know for each vehicle model - the EPA base models split into separate nameplates, the other spellings each source or customer uses for one vehicle, the make spellings, and the trim words left off when a customer's vehicle is matched - used by the import, the third-row list and link_vehicles.
  updated: 2026-10-24
  status: current
  explained_in: docs/reference/vehicle-catalog.md
  note: >-
    Names are compared on capitals and digits only, so "F150" and "F-150" are already the same
    name; list only spellings that differ in more than that. Edit this file to add a nameplate or a
    spelling; the next import_vehicle_data run splits or merges the catalog models and lists each
    change in its report, and the next link_vehicles run matches customers' vehicles with it. Add a
    spelling here, never in code.

# Another source's or a customer's spelling of a make, then the catalog's.
make_aliases:
  RAM TRUCKS: Ram
  Chevy: Chevrolet
  Mercedes: Mercedes-Benz
  Benz: Mercedes-Benz
  VW: Volkswagen
  Harley: Harley-Davidson
  Harley Davidson: Harley-Davidson

# The EPA groups its rows by base model, which can hold several vehicles a
# customer knows apart, such as the Santa Fe and the Santa Fe Sport. A row of
# the base model whose EPA model name contains one of a nameplate's phrases,
# as whole words, belongs to that nameplate ("Range Rover Sport" also matches
# "New Range Rover Sport P360 MHEV"); the rest stay with the base model.
# The Canadian specifications' trims are split the same way, so the
# "EQE CLASS 350 4MATIC 4DR SUV" trim's weight goes to the EQE SUV, not the
# EQE sedan (decision 0075).
nameplates:
  - make: Hyundai
    base_model: Santa Fe
    split:
      - {name: Santa Fe Sport, when: [Santa Fe Sport]}
      - {name: Santa Fe XL, when: [Santa Fe XL]}
  - make: Jeep
    base_model: Grand Cherokee
    split:
      - {name: Grand Cherokee L, when: [Grand Cherokee L]}
  - make: Jeep
    base_model: Wagoneer
    split:
      - {name: Wagoneer S, when: [Wagoneer S]}      # the two-row electric Wagoneer S, from 2024
  - make: Volkswagen
    base_model: Atlas
    split:
      - {name: Atlas Cross Sport, when: [Atlas Cross Sport]}
  - make: Lexus
    base_model: RX
    split:
      - {name: RX 350L, when: [RX 350 L]}
      - {name: RX 450hL, when: [RX 450h L]}
  - make: Mitsubishi
    base_model: Outlander
    split:
      - {name: Outlander Sport, when: [Outlander Sport]}
      - {name: Outlander PHEV, when: [Outlander PHEV]}
  - make: Buick
    base_model: Encore
    split:
      - {name: Encore GX, when: [Encore GX]}
  - make: Land Rover
    base_model: Range Rover
    split:
      - {name: Range Rover Sport, when: [Range Rover Sport]}
      - {name: Range Rover Velar, when: [Range Rover Velar]}
      - {name: Range Rover Evoque, when: [Range Rover Evoque]}
  - make: Land Rover
    base_model: Defender
    split:
      - {name: Defender 90, when: [Defender 90]}
      - {name: Defender 110, when: [Defender 110]}
      - {name: Defender 130, when: [Defender 130]}
  - make: Land Rover
    base_model: Discovery
    split:
      - {name: Discovery Sport, when: [Discovery Sport]}
  - make: GMC
    base_model: Yukon
    split:
      - {name: Yukon XL, when: [XL]}                # "Yukon XL 1500 4WD", "Yukon C1500 XL 2WD"
  - make: Cadillac
    base_model: Escalade
    split:
      - {name: Escalade ESV, when: [ESV]}
      - {name: Escalade EXT, when: [Ext]}           # the Escalade pickup
  - make: Lincoln
    base_model: Navigator
    split:
      - {name: Navigator L, when: [Navigator L]}
  - make: Ford
    base_model: Expedition
    split:
      - {name: Expedition EL, when: [Expedition EL]}
      - {name: Expedition MAX, when: [Expedition MAX]}
  - make: Mercedes-Benz
    base_model: EQE
    split:
      - {name: EQE SUV, when: [SUV]}                # "EQE 350 4matic (SUV)"
  - make: Mercedes-Benz
    base_model: EQS
    split:
      - {name: EQS SUV, when: [SUV]}
  - make: Chevrolet
    base_model: Silverado
    split:
      - {name: Silverado HD, when: [Silverado 2500, Silverado 3500]}
  - make: GMC
    base_model: Sierra
    split:
      - {name: Sierra HD, when: [Sierra 2500, Sierra 3500]}
  - make: Chevrolet
    base_model: Suburban
    split:
      - {name: Suburban HD, when: [Suburban 2500]}

# One vehicle, one name: the name customers know, then the other spellings
# the sources use for it. The import merges catalog models that are one
# vehicle; the third-row list and vehicle matching look names up here too.
aliases:
  - {make: Ford, name: F-150, also: [F-150 Lightning]}
  - {make: Ford, name: F-250, also: [F-250 Super Duty]}
  - {make: Ford, name: F-350, also: [F-350 Super Duty]}
  - {make: Jeep, name: Wrangler, also: [Wrangler/TJ]}
  - {make: Mercedes-Benz, name: ML, also: [ML-Class, M-Class]}
  - {make: Mercedes-Benz, name: GL, also: [GL-Class]}
  - {make: Mercedes-Benz, name: GLA, also: [GLA-Class]}
  - {make: Mercedes-Benz, name: GLB, also: [GLB-Class]}
  - {make: Mercedes-Benz, name: GLC, also: [GLC-Class]}
  - {make: Mercedes-Benz, name: GLE, also: [GLE-Class]}
  - {make: Mercedes-Benz, name: GLK, also: [GLK-Class]}
  - {make: Mercedes-Benz, name: GLS, also: [GLS-Class]}
  - {make: Mercedes-Benz, name: EQB, also: [EQB-Class]}
  - {make: Mercedes-Benz, name: EQE, also: [EQE-Class, EQE-Class Sedan, EQE Sedan]}
  - {make: Mercedes-Benz, name: EQS, also: [EQS-Class, EQS-Class Sedan, EQS Sedan]}
  - {make: Mercedes-Benz, name: EQE SUV, also: [EQE-Class SUV]}
  - {make: Mercedes-Benz, name: EQS SUV, also: [EQS-Class SUV]}
  - {make: Mazda, name: Mazda2, also: ["2"]}
  - {make: Mazda, name: Mazda3, also: ["3"]}
  - {make: Mazda, name: Mazda5, also: ["5"]}
  - {make: Mazda, name: Mazda6, also: ["6"]}
  - {make: Chevrolet, name: Captiva Sport, also: [Captiva]}
  - {make: Chevrolet, name: Traverse, also: [Traverse Limited]}
  - {make: Chevrolet, name: Silverado HD, also: [Silverado 2500HD, Silverado 3500HD, Silverado 2500 HD, Silverado 3500 HD]}
  - {make: GMC, name: Sierra HD, also: [Sierra 2500HD, Sierra 3500HD, Sierra 2500 HD, Sierra 3500 HD, C2500 Sierra, K2500 Sierra]}
  - {make: Toyota, name: RAV4 Prime, also: [RAV4 Prime (PHEV)]}
  - {make: Land Rover, name: Range Rover Evoque, also: [Evoque]}
  # Spellings customers use, from the job history (link_vehicles).
  - {make: Chevrolet, name: Silverado, also: [Silverado 1500]}
  - {make: GMC, name: Sierra, also: [Sierra 1500]}
  # The name as the maker writes it, where a source spells it with other
  # capitals or spacing in some years, such as the EPA's "350z". Names
  # compare without capitals and spaces, so each entry needs no other
  # spelling: the import renames the catalog model to the name here.
  - {make: Nissan, name: 350Z}                      # EPA "350z", 2003-2009
  - {make: Nissan, name: 370Z}                      # EPA "370z" in 2009
  - {make: Nissan, name: LEAF}                      # EPA "Leaf" to 2022
  - {make: Chevrolet, name: Bolt}                   # EPA "BOLT" for 2027
  - {make: Maserati, name: GranTurismo}             # EPA "Granturismo" from 2024
  - {make: Jaguar, name: S-Type}                    # EPA "S-type"
  - {make: Lotus, name: Elise/Exige}                # EPA "Elise/exige" in 2005
  - {make: Ferrari, name: F40}                      # EPA "F 40" in 1990

# A customer's name for a vehicle that the catalog files under another name,
# or another make, read by link_vehicles only (decision 0080). `names` are the
# customer's spellings for the make; `catalog_make` (the same make when left
# out) and `catalog_model` the catalog's name, which the aliases above and the
# trim words then apply to. `from` and `to` limit an alias to those model
# years: outside them the name means what it says, and with no year recorded
# the vehicle is left for the owner, because the year decides.
customer_aliases:
  - {make: Dodge, names: [Ram, Ram 1500], from: 2011, catalog_make: Ram, catalog_model: "1500"}
  - {make: Dodge, names: [Ram 2500], from: 2011, catalog_make: Ram, catalog_model: "2500"}
  - {make: Chevrolet, names: ["2500", 2500HD], catalog_model: Silverado 2500 HD}
  - {make: Lexus, names: [GX550, GX 550], catalog_model: GX}
  - {make: Mercedes-Benz, names: [CLS 550], catalog_model: CLS-Class}
  - {make: BMW, names: [530i], catalog_model: 5 Series}
  - {make: BMW, names: [650i], catalog_model: 6 Series}

# Words a customer's vehicle record may carry after the model name, such as
# "Camry LE", "F150 XLT" or "CR-V EX-L". link_vehicles matches the longest
# start of the model field that is a catalog model of the make and year, and
# only when every word after it is on this list. A word that could name a
# different vehicle stays off it: "Sport", "XL", "L", "Max", "EL", "ESV" and
# "HD" name nameplates in the list above, and a series number such as 2500
# names a heavier truck, so "Silverado 2500" is never matched to the
# Silverado. A vehicle whose leftover words are not all here is listed in the
# report as not found, with the nearest name, for the owner to add a spelling.
# A phrase here is read as its words, so "Crew Cab" also lets "Crew" and "Cab"
# be left off. Even a word on this list is not left off when the model's
# nameplates above use it, so a "Wagoneer S" is never matched to the Wagoneer.
trim_words:
  # Toyota, Lexus, Honda, Acura, Nissan, Infiniti, Subaru, Mazda, Hyundai, Kia
  - CE
  - LE
  - SE
  - XLE
  - XSE
