meta:
  title: Third-row seating seed list
  summary: Which crossovers and midsize SUVs sold in the US since 2010 have a third row always, optionally, or never. Seeds the third-row flag in Phase 2, Step 2.
  updated: 2026-10-22
  status: current
  explained_in: docs/reference/vehicle-classification.md
  note: >-
    Prepared from manufacturer and review information and checked by the owner.
    always = three rows, never asked; never = two rows, never asked; optional = the booking form asks.
    When in doubt a model is optional, because one extra question is better than a wrong price.
    Models are matched to the catalog by make and model name, with the alias list for spelling
    differences; a name with a slash lists the names the model was sold under. Years are model years,
    and last_year empty means still sold. A model in the catalog and not in this list falls back to
    NHTSA data where it has any, then to optional.
