meta:
  title: Approval spot-check list
  summary: The vehicle models the owner spot-checks on the control app's approval list, alongside every model in the job history and every model near a size line, before Phase 2 is done.
  updated: 2026-10-28
  status: current
  explained_in: docs/reference/vehicle-classification.md
  note: >-
    Each entry is a make and a model as customers name them, matched to the catalog by the names in
    data/vehicle-names.yaml, every catalog model of that name. year_from and year_to, when given,
    limit the entry to those model years, and the approval list shows only the model's year ranges
    that overlap them. An entry that matches no catalog model is shown on the approval list as not
    found, so a spelling can be added there. The approval list started over when the size-based
    classes were applied (decision 0083). Besides this list it shows, without listing them here,
    every model in the job history, every model with model years from 2015 on within 5 cubic feet of
    a size line or the pickup line (near_line and newest_from in data/size-classes.yaml), because
    those change with the data, and every model approved since.

# The owner's spot-check list for the size-based classes (2026-10-28).
models:
  - {make: Toyota, model: Tacoma, year_from: 2024}
  - {make: GMC, model: Canyon, year_from: 2025}
  - {make: Rivian, model: R1T}
  - {make: Cadillac, model: Escalade, why: once priced with the Suburban by a model override}
  - {make: Toyota, model: Highlander, year_from: 2020}
  - {make: Nissan, model: Murano, year_from: 2025}
  - {make: Jeep, model: Wrangler, why: once priced with the light pickups by a model override}
  - {make: Ford, model: Bronco}
  - {make: Chevrolet, model: Tahoe, year_to: 2006}
  - {make: Chevrolet, model: Suburban, year_to: 1997}
