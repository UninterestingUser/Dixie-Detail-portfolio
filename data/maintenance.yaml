meta:
  title: Maintenance list
  summary: Each component the system runs on, with its pinned version, where it is pinned, the upstream end-of-life date, who watches it, and how to update and test it.
  updated: 2026-11-22
  status: current
  explained_in: docs/architecture/keeping-components-current.md
  # end_of_life: a date is the upstream end of support for the pinned
  # version; "none published" means upstream gives no date, and text
  # describes the policy instead. Dates were checked on the updated date.
  # watched_by: who watches the component, one or more of:
  #   dependabot - the Python and npm packages, the image tags and the
  #     GitHub Actions: minor, patch and security updates, as pull requests
  #     (decision 0118);
  #   grok-bot - the owner's Grok Bot, kept outside this repository: Ubuntu
  #     releases and security notices on both hosts, the kernel, the major
  #     versions of PostgreSQL and Python, and the other components marked
  #     here. It also watches every end_of_life date in this list, whoever
  #     the component's watcher is;
  #   owner - the two hosts' firmware.
  # Grok Bot only recommends. The owner acts on every report, Dependabot's
  # and Grok Bot's, and nothing changes without the owner and a pull request.
  # The maintenance assistant reviews each Dependabot pull request as it
  # opens. Until launch the owner merges them all. After launch the
  # assistant may merge a Dependabot minor, patch or security update once
  # every check has passed; a major update, a pull request that changes more
  # than dependency files, and every deploy stay with the owner (decision
  # 0122, docs/architecture/keeping-components-current.md).
  # status: only on an entry that is planned, not yet in use.
  # Hosts are named by role: the production host runs the stack, and the
  # backup host keeps the backups. Until task B2 moves production to its new
  # host, the current server is both.
  # pinned: for a component Dependabot watches, the version line; the exact
  # version is in the file pinned_in names, which Dependabot keeps current.
  # Change this list when a line changes (a planned upgrade, or a major
  # update merged), in the same pull request.

components:
  - name: Ubuntu Server release
    pinned: Ubuntu 26.04.1 LTS (Resolute Raccoon) on the current server; the production host will run the same release (B2)
    pinned_in: each host; the Tests workflow's ops-on-26-04 job runs the ops-script tests on the same release
    end_of_life: 2031-05 (end of standard support, from Canonical's list of releases and kernel lifecycle table)
    watched_by: grok-bot
    update: Point releases (26.04.2 and later) come with apt. The next release is planned work; run tools/test-timeout.sh and tools/run-tests.sh --ops-only on it first, and move the ops-on-26-04 job in the same pull request.
    test: tools/test-timeout.sh and tools/run-tests.sh --ops-only on the host, then the restore test and the gosu test.

  - name: GNU timeout (gnutimeout)
    pinned: not pinned; GNU coreutils 9.7 from Ubuntu's gnu-coreutils package (priority required, so on every 26.04 install)
    pinned_in: apt on each host; ops/lib/restic.sh picks it with gnu_timeout
    end_of_life: none published; it goes with the Ubuntu release
    watched_by: grok-bot
    update: apt, with the other updates. 26.04's plain timeout is uutils coreutils 0.10.0, which kills restic at once when given --signal=INT with --kill-after, so the backup must keep using GNU's (decision 0121).
    test: tools/test-timeout.sh on the host.

  - name: Linux kernel
    pinned: the GRUB default, set by title, on 26.04's general availability (GA) kernel track, Linux 7.0
    pinned_in: GRUB on each host (docs/operations/updating-the-kernel.md)
    end_of_life: 2031-05 for 26.04's 7.0 GA kernel (Canonical's kernel lifecycle table, ubuntu.com/kernel/lifecycle)
    watched_by: grok-bot
    update: Boot each new kernel once with grub-reboot, and make it the default only after the gosu test passes (decision 0088). Grok Bot also watches for the Ubuntu kernel that fixes the gosu and AppArmor hang, which ends the pin.
    test: ops/gosu-test.sh, then the stack's status and the control app over Tailscale.

  - name: Docker Engine and Docker Compose
    pinned: not pinned; each host's packages (Ubuntu's, or Docker's own if Phase 0 needed them)
    pinned_in: apt on each host
    end_of_life: none published (Docker Engine is maintained by the Moby project, with no list of supported versions)
    watched_by: grok-bot
    update: sudo apt update && sudo apt upgrade at a quiet time, then sudo systemctl restart dixie-stack.
    test: docker compose ps shows every service up and db and app healthy; the public health check stays green.

  - name: PostgreSQL major version
    pinned: "18 (the postgres:18.x-trixie image)"
    pinned_in: compose.yaml (db); tools/run-tests.sh and the ops scripts read the same tag
    end_of_life: 2030-11-14
    watched_by: [dependabot, grok-bot]
    update: Minor releases come in Dependabot's compose pull request; Grok Bot watches the major version. A major upgrade is planned work, a dump and restore into the new version (never a new tag on the old volume).
    test: tools/run-tests.sh (it starts the compose tag), then after the deploy the nightly backup and the restore test.

  - name: Python
    pinned: "3.13 (the python:3.13.x-slim-trixie image)"
    pinned_in: app/Dockerfile and app/Dockerfile.test (tools/run-tests.sh checks they match)
    end_of_life: 2029-10
    watched_by: [dependabot, grok-bot]
    update: Dependabot sends patch releases only; Grok Bot watches the major version, and 3.14 and later are planned upgrades.
    test: tools/run-tests.sh.

  - name: Django
    pinned: "5.2 LTS"
    pinned_in: app/requirements.txt
    end_of_life: 2028-04
    watched_by: dependabot
    update: Patch releases in Dependabot's pip pull request. The next LTS is a planned upgrade, before 2028-04.
    test: tools/run-tests.sh.

  - name: gunicorn
    pinned: "27.x (from 26.x with Dependabot's #93)"
    pinned_in: app/requirements.txt
    end_of_life: none published
    watched_by: dependabot
    update: Dependabot's pip pull request; a major update comes on its own.
    test: tools/run-tests.sh, then after the deploy the app's healthcheck and the control app.

  - name: Pillow and libheif
    pinned: "Pillow 13.x (from 12.x in decision 0120), pillow-heif 1.x (its wheels include libheif)"
    pinned_in: app/requirements.txt
    end_of_life: none published; fixes go to the newest release
    watched_by: dependabot
    update: Dependabot's pip pull request; a major update comes on its own. They read customers' quote request photos, so take their security updates promptly, and keep the upload limited to the four accepted decoders (decision 0120).
    test: tools/run-tests.sh (the quote request photo tests read JPEG and HEIC photos).

  - name: Node on Cloudflare Pages
    pinned: "24 LTS (from 22 in decision 0121)"
    pinned_in: site/.nvmrc (the Site workflow), and the Pages build setting NODE_VERSION (data/configuration.yaml)
    end_of_life: 2028-04-30
    watched_by: grok-bot
    update: Planned upgrade before 2028-04-30. Change site/.nvmrc, the engines line in site/package.json and NODE_VERSION on the Pages project together.
    test: The Site workflow, then a staging build and a test booking (docs/guides/previewing-and-deploying-the-website.md).

  - name: Astro
    pinned: "7.x (from 5.x in decision 0119)"
    pinned_in: site/package.json and site/package-lock.json
    end_of_life: none published; Astro gives security fixes to the previous major version only
    watched_by: dependabot
    update: Minor and patch releases in Dependabot's npm pull request; a major update comes on its own and follows Astro's upgrade guide.
    test: The Site workflow (build, price check, unit, browser and Lighthouse tests).

  - name: Offline replay Worker's compatibility date
    pinned: "2026-11-01"
    pinned_in: site/workers/offline-replay/wrangler.toml (compatibility_date)
    end_of_life: none; Cloudflare keeps an old compatibility date working
    watched_by: grok-bot
    update: Move the date forward only for a runtime change the Worker needs, then deploy with site/workers/offline-replay/deploy.sh.
    test: npm run test:unit in site/, deploy.sh --dry-run, then a staging offline request (the website guide).

  - name: Wrangler
    pinned: "4.48.0"
    pinned_in: site/workers/offline-replay/deploy.sh and the commands in the website guide and wrangler.toml
    end_of_life: none published
    watched_by: grok-bot
    update: Change every wrangler@ version in one pull request (grep -rn "wrangler@" site docs).
    test: tools/test-worker-deploy.sh, then deploy.sh --dry-run.

  - name: cloudflared
    pinned: "the release in compose.yaml (2026.10.2 on 2026-11-21)"
    pinned_in: compose.yaml (cloudflared)
    end_of_life: one year after each release (about 2027-10 for 2026.10.2)
    watched_by: [dependabot, grok-bot]
    update: Dependabot's compose pull request; a new year's version comes on its own, as its version is the year.
    test: After the deploy, docker compose ps and the public health check.

  - name: Caddy
    pinned: "2.x (the caddy:2.x-alpine image)"
    pinned_in: compose.yaml (caddy)
    end_of_life: none published; fixes go to the newest release
    watched_by: [dependabot, grok-bot]
    update: Dependabot's compose pull request.
    test: After the deploy, the control app over Tailscale and the public health check.

  - name: restic
    pinned: not pinned; Ubuntu's package (0.17 or later needed, for restic dump --target)
    pinned_in: apt on each host that runs the backup or the restore test
    end_of_life: none published; fixes go to the newest release
    watched_by: grok-bot
    update: apt, with the other updates.
    test: The next nightly backup's Healthchecks ping, then the restore test.

  - name: restic rest-server
    status: planned (not installed yet)
    pinned: not installed yet
    pinned_in: the backup host, once a task sets it up
    end_of_life: none published; fixes go to the newest release
    watched_by: grok-bot
    update: Written with the task that installs it.
    test: Written with the task that installs it; at least a nightly backup to it and the restore test from it.

  - name: rclone
    pinned: not pinned; Ubuntu's package
    pinned_in: apt on the host that runs the backup
    end_of_life: none published; kept until it is retired from the backup
    watched_by: grok-bot
    update: apt, with the other updates.
    test: The next nightly backup's Healthchecks ping, then the restore test.

  - name: Bitwarden Secrets Manager CLI (bws)
    pinned: not pinned; installed from Bitwarden's Linux download
    pinned_in: each host's bws binary
    end_of_life: none published
    watched_by: grok-bot
    update: Download the new release as in the Phase 0 runbook's Step 2, replacing the binary.
    test: tools/test-bws.sh, then sudo systemctl restart dixie-stack and docker compose ps.

  - name: Tailscale
    pinned: not pinned; each host's package
    pinned_in: apt on each host, and each staff device
    end_of_life: none published
    watched_by: grok-bot
    update: apt on each host; the app stores on the phones.
    test: The control app opens over Tailscale, and tailscale serve status still shows port 8000.

  - name: apcupsd
    pinned: not pinned; Ubuntu's package
    pinned_in: apt on the host the battery unit is connected to by USB
    end_of_life: none published; the last upstream release is 3.14.14, from 2016
    watched_by: grok-bot
    update: apt, with the other updates; it still needs restarting after a configuration change.
    test: apcaccess status shows STATUS ONLINE and the shutdown levels.

  - name: Production host firmware
    status: planned (task B2 makes this machine the production host)
    hardware: Intel NUC5i7RYH mini PC (2 cores, 16 GB, 512 GB NVMe boot drive, Intel PTT), discontinued in 2015
    pinned: BIOS 0381 (2019-08-07), Intel's last release on its download center
    pinned_in: the production host
    end_of_life: ended; the downloads have since been removed, and no further updates are expected
    watched_by: owner
    update: None to install.
    test: None.

  - name: Backup host firmware
    hardware: Gigabyte B550 board (AMD Ryzen 5 5600), the current server
    pinned: the installed BIOS
    pinned_in: the backup host
    end_of_life: none published
    watched_by: owner
    update: Flash a new BIOS only for a fix this host needs, at a quiet time, after a backup. A BIOS update can reset the firmware TPM (fTPM), which locks the Bitwarden token encrypted with it; be ready to encrypt the token again (the Phase 0 runbook's Step 2).
    test: systemd-analyze has-tpm2 says yes, the token decrypts (sudo systemd-creds decrypt --name=bws-token /etc/credstore.encrypted/dixie-bws-token.cred - | wc -c), and sudo systemctl restart dixie-stack brings every container up.

  - name: Google Maps Platform APIs
    pinned: Places API (New) (Autocomplete in the browser, Place Details with Essentials fields, Text Search with place ids only), Routes API, Maps Embed API
    pinned_in: app/geo/google.py, app/geo/drive.py, and the site's address field and map
    end_of_life: none announced for these APIs; Google announces deprecations on each API's page and by email to the billing account
    watched_by: grok-bot
    update: Follow Google's migration guide in a pull request, with the call counts and caps (decision 0091) checked afterwards.
    test: tools/run-tests.sh (Google is faked), then api_smoke_test on the production host and a staging booking.
