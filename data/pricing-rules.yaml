meta:
  title: Pricing rules
  summary: The numbers behind pricing and service time - condition levels, maintenance ratios, crew time, rounding and the full-day flag - used to seed the pricebook.
  updated: 2026-10-17
  status: current
  explained_in: docs/reference/pricing.md
  note: Launch defaults. Once the control app exists, the live values are in the database; update this file when a default changes.

price_lookup_keys: [service, vehicle_class, size_variant]
missing_combination: does not exist (no price, not bookable)

condition_levels:
  applies_to: [Full Detail, Interior Only, Exterior Only]
  rounding: whole dollar
  levels:
    - level: 1
      adjustment_percent: 0
    - level: 2
      adjustment_percent: 10
      mockup_label: Needs attention
    - level: 3
      adjustment_percent: 20

maintenance_plans:
  base_service: Full Detail
  quarterly_percent_of_full_detail: 80
  monthly_percent_of_full_detail: 50
  service_hours: same as Full Detail

service_time:
  matrix_hours: one-person service time only; setup and breakdown are not included (decision 0058)
  time_on_site: service time + setup + breakdown, from data/booking-rules.yaml (decision 0056)

crew:
  sizes: [1, 2]
  two_person_time_factor: 0.60     # applies to service time
  service_time_rounding_minutes: 15   # service time for the crew; time on site rounds the same way
  rounding_method: nearest
  default_crew:
    Monthly Maintenance: 2
    all_other_services: 1

full_day_flag:
  threshold_one_person_time_on_site_hours: 8   # 7 service hours plus 1 hour of setup and breakdown; the same jobs as the earlier 8 one-person hours
  action: Flag in the control app for a second person; the estimate card shows "full day" instead of hours
  blocks_booking: false

promotions:
  percentage_rounding: nearest cent   # 0.01; an exact half cent rounds up (decision 0055)
  applies_to: the lines for the promotion's services (the main service with its condition adjustment, and add-ons); none listed means the whole job
  combining: not yet set by the owner; the engine applies them in order, each on what is left, never below zero
  kinds: [percent_off, amount_off, fixed_price, voucher]

price_build_order:
  - base price from the price matrix
  - condition adjustment
  - add-ons
  - promotions
  - sales tax at the service address's rate
  - on-site adjustment with a reason

quote:                    # decision 0059; built in Phase 1 Step 3 (app/pricebook/pricing.py), used by the website from Phase 3
  issued_by: the server's pricing engine only
  holds: [inputs, lines, totals, pricebook version, tax rate, service time, time on site]
  booking: references the quote, never a price sent from the browser
  becomes: the appointment's line snapshot (decision 0033)
  owner_alert: any price change on a booked job not made by the owner
  sales_tax: rate on the day of service; the price before tax never changes. Zero until Phase 3 adds the rate lookup

worked_example:
  vehicle: 2019 Toyota RAV4 (Crossovers & Wagons, 2 rows)
  lines:
    - {item: Full Detail, price: 250, one_person_service_hours: 5}
    - {item: "Condition level 2 (+10%)", price: 25}
    - {item: Seat Extraction, price: 80, one_person_service_hours: 1.5}
  total_before_tax: 355
  one_person_service_hours: 6.5
  one_person_time_on_site_hours: 7.5
