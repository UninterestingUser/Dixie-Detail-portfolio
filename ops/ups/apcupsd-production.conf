## apcupsd on the production host (decision 0128): the UPS's USB cable is
## plugged in here, and this host serves the UPS's status to the backup host
## on port 3551 (the host firewall allows only the backup host's address).
## Installed as /etc/apcupsd/apcupsd.conf by ops/ups/install.sh production.
UPSNAME dixie-ups
UPSCABLE usb
UPSTYPE usb
# Blank: apcupsd finds the USB UPS itself.
DEVICE
LOCKFILE /var/lock
SCRIPTDIR /etc/apcupsd
# Ubuntu's shutdown hook (/usr/lib/systemd/system-shutdown/apcupsd_shutdown)
# looks for the powerfail flag here and, when it finds it, tells the UPS to
# switch its outlets off (apccontrol killpower). The UPS switches them back
# on when mains power returns, and both hosts start again (their firmware is
# set to power on after a power loss).
PWRFAILDIR /etc/apcupsd
NOLOGINDIR /etc

# Seconds on battery before apcupsd counts it a power failure, so a flicker
# doesn't count.
ONBATTERYDELAY 6
# Shut down at whichever comes first: 20% charge left, or about 5 minutes
# of runtime left (the UPS's own estimate). The backup host has already
# shut down by then (after 2 minutes on battery).
BATTERYLEVEL 20
MINUTES 5
# No timer here: the two levels above decide.
TIMEOUT 0
ANNOY 300
ANNOYDELAY 60
NOLOGON disable
# 0: the shutdown hook, not a delay, switches the UPS off.
KILLDELAY 0

# The network server, for the backup host's apcupsd.
NETSERVER on
NISIP 0.0.0.0
NISPORT 3551

EVENTSFILE /var/log/apcupsd.events
EVENTSFILEMAX 10
UPSCLASS standalone
UPSMODE disable
STATTIME 0
STATFILE /var/log/apcupsd.status
LOGSTATS off
DATATIME 0
