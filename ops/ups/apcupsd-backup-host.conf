## apcupsd on the backup host (decision 0128): a network client of the
## production host's apcupsd, which has the UPS's USB cable. Installed as
## /etc/apcupsd/apcupsd.conf by ops/ups/install.sh backup-host, which puts
## PRODUCTION_HOST_ADDRESS from .env in place of the placeholder below.
UPSNAME dixie-ups
UPSCABLE ether
UPSTYPE net
DEVICE PRODUCTION_HOST_ADDRESS:3551
# Ask the production host every 10 seconds (the default is a minute).
POLLTIME 10
LOCKFILE /var/lock
SCRIPTDIR /etc/apcupsd
PWRFAILDIR /etc/apcupsd
NOLOGINDIR /etc

ONBATTERYDELAY 6
# Shut down after 2 minutes on battery, well before the production host,
# so the backup host is off before the UPS switches its outlets off. The
# two levels are a backstop for a weak battery.
TIMEOUT 120
BATTERYLEVEL 30
MINUTES 8
ANNOY 300
ANNOYDELAY 60
NOLOGON disable
# This host can't switch the UPS off (the net driver has no way to); the
# production host does.
KILLDELAY 0

# No network server here.
NETSERVER off

EVENTSFILE /var/log/apcupsd.events
EVENTSFILEMAX 10
UPSCLASS standalone
UPSMODE disable
STATTIME 0
STATFILE /var/log/apcupsd.status
LOGSTATS off
DATATIME 0
