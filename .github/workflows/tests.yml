name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned to the server's release. ubuntu-latest became 26.04 in
    # November 2026, whose uutils coreutils `timeout` ignores --signal=INT
    # and kills restic outright (docs/operations/troubleshooting.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The same command as on the workstation; Podman is on the runner image.
      - run: tools/run-tests.sh
