name: Docs

on:
  pull_request:
    paths: ["docs/**", "data/**", "README.md", "CLAUDE.md", "llms.txt", ".env.example", "tools/check_docs.py", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned, so a change of ubuntu-latest never changes this check unseen.
    # The servers run 26.04; the Tests workflow checks the ops scripts there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/check_docs.py
