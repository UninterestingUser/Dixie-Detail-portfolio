name: Docs

on:
  pull_request:
    paths: ["docs/**", "data/**", "README.md", "CLAUDE.md", "llms.txt", ".env.example", "tools/check_docs.py"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/check_docs.py
