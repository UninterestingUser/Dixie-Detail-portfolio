name: Docs

on:
  pull_request:
    paths: ["docs/**", "data/**", "README.md", "CLAUDE.md", "llms.txt", ".env.example", "tools/check_docs.py", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned to the server's release. ubuntu-latest became 26.04 in
    # November 2026, whose uutils coreutils `timeout` ignores --signal=INT
    # and kills restic outright (docs/operations/troubleshooting.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/check_docs.py
